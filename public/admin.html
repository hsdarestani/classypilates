<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classy Pilates — Booking Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;font-family:Manrope;background:#f3efe7;color:#151513}.top{padding:24px 4vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d5cfc4}.top a{color:inherit}.wrap{padding:40px 4vw}.auth,.panel{background:#fff;border:1px solid #ddd5ca;border-radius:20px;padding:22px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,button{font:inherit;padding:12px;border:1px solid #d5cfc4;border-radius:10px;background:#fff}button{background:#151513;color:#fff;cursor:pointer}.table{overflow:auto}.row{display:grid;grid-template-columns:1.25fr .9fr .7fr .8fr .55fr .45fr;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #eee}.row.head{font-size:10px;font-weight:700;letter-spacing:.12em}.muted{color:#756e65;font-size:12px}.status{padding:5px 8px;border-radius:999px;background:#ece7de;font-size:10px;display:inline-block}.danger{background:#fff;color:#9d2929;border-color:#d9bcbc}.msg{font-size:12px;margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.row.head{display:none}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div><b>CLASSY PILATES</b><div class="muted">Booking Operations</div></div><a href="./index.html">Zur Website</a></header><main class="wrap"><section class="auth"><h2>Admin verbinden</h2><p class="muted">Der Admin-Token wird nur in diesem Browser-Tab gespeichert.</p><div class="grid"><input id="token" type="password" placeholder="ADMIN_TOKEN"><button id="connect">Verbinden</button></div><div id="authMsg" class="msg"></div></section><section class="panel"><h2>Class anlegen / bearbeiten</h2><div class="grid"><select id="location"><option value="bhf1">Bahnhofsviertel · 1. OG</option><option value="ladies">Bahnhofsviertel · Ladies</option><option value="sachsen">Sachsenhausen</option><option value="bornheim">Bornheim</option><option value="mid">Mid</option><option value="oval">Oval</option></select><select id="type"><option>Reformer</option><option>Powerformer</option><option>Mat</option><option>Barre</option></select><input id="name" placeholder="Class name" value="Total Body"><input id="coach" placeholder="Coach"><input id="startsAt" type="datetime-local"><input id="duration" type="number" value="50" min="15"><input id="capacity" type="number" value="10" min="1"><button id="saveClass">Speichern</button></div><div id="saveMsg" class="msg"></div></section><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><div><h2>Schedule</h2><p class="muted">Zentrale Classes aller sechs Standorte</p></div><button id="refresh">Aktualisieren</button></div><div class="table"><div class="row head"><span>CLASS</span><span>STUDIO</span><span>START</span><span>COACH</span><span>PLÄTZE</span><span></span></div><div id="rows"></div></div></section></main><script src="./admin.js"></script></body></html>
