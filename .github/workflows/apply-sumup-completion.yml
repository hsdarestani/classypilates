name: Apply SumUp Completion Patch

on:
  push:
    branches: [fix/sumup-production-ready]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip sumup patch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sumup-production-ready
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply controlled patch
        run: python scripts/apply_sumup_completion.py

      - name: Validate requested checks
        run: |
          python -m py_compile server/main.py server/feedback_app.py
          node --check public/booking-flow.js
          node --check public/shop.js
          git diff --check

      - name: Commit patched implementation
        run: |
          mkdir -p tmp
          cp .github/workflows/deploy-production.yml tmp/deploy-production.patched.yml
          git checkout -- .github/workflows/deploy-production.yml
          git config user.name 'classy-sumup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server/main.py server/feedback_app.py public/booking-flow.js public/shop.js tmp/deploy-production.patched.yml
          git commit -m 'feat: complete production SumUp payments [sumup-patch]'
          git push origin HEAD:fix/sumup-production-ready
