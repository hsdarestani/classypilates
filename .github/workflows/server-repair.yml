name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- inspect Mindbody webhook account state ---'
          docker compose exec -T api python - <<'PY'
          import json, os
          import mindbody_webhooks as wh

          print("ENV", json.dumps({
              "signature_key_present": bool((os.getenv("MINDBODY_WEBHOOK_SIGNATURE_KEY") or "").strip()),
              "subscription_id_present": bool((os.getenv("MINDBODY_WEBHOOK_SUBSCRIPTION_ID") or "").strip()),
              "api_key_present": bool((os.getenv("MINDBODY_API_KEY") or "").strip()),
          }, sort_keys=True))
          try:
              payload = wh._push_request("GET", "subscriptions")
              items = payload.get("items") or payload.get("Items") or []
              print("SUBSCRIPTIONS", json.dumps([{
                  "subscriptionId": row.get("subscriptionId"),
                  "status": row.get("status"),
                  "referenceId": row.get("referenceId"),
                  "webhookUrl": row.get("webhookUrl"),
                  "eventIds": row.get("eventIds"),
                  "statusChangeMessage": row.get("statusChangeMessage"),
              } for row in items if isinstance(row, dict)], ensure_ascii=False, sort_keys=True))
          except Exception as exc:
              print("SUBSCRIPTIONS_ERROR", type(exc).__name__, str(exc)[:1500])
          PY

          echo '--- api health after webhook diagnostics ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- api health after targeted reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
