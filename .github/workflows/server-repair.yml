name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- inspect Bornheim 2026-09-25 09:00 exactly (live) ---'
          docker compose exec -T api python - <<'PY'
          import json, urllib.parse, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import mindbody_sync as mb

          berlin=ZoneInfo("Europe/Berlin")
          url='http://127.0.0.1:8000/api/schedule?'+urllib.parse.urlencode({
              'from':'2026-09-25','to':'2026-09-26'
          })
          with urllib.request.urlopen(url,timeout=30) as r:
              payload=json.loads(r.read().decode())
          rows=payload if isinstance(payload,list) else payload.get('items') or payload.get('classes') or []

          site=[]
          for row in rows:
              raw=str(row.get('starts_at') or row.get('start') or row.get('startsAt') or row.get('start_time') or '')
              if not raw:
                  continue
              dt=datetime.fromisoformat(raw.replace('Z','+00:00'))
              if dt.tzinfo is None:
                  dt=dt.replace(tzinfo=ZoneInfo("UTC"))
              dt=dt.astimezone(berlin)
              b=json.dumps(row,ensure_ascii=False).casefold()
              if dt.strftime("%Y-%m-%d %H:%M")=="2026-09-25 09:00" and "bornheim" in b:
                  site.append(row)
          print("SITE_ROWS", json.dumps(site,ensure_ascii=False,sort_keys=True))

          client=mb.WriteClient.from_env()
          p=client.get_classes(
              start_date_time="2026-09-25T00:00:00+02:00",
              end_date_time="2026-09-26T00:00:00+02:00",
              limit=300,offset=0,public_only=True
          )
          remote=[]
          for row in mb._extract_list(p,("Classes","classes","Items")):
              if not isinstance(row,dict):
                  continue
              loc=str((row.get("Location") or {}).get("Name") or "").casefold()
              start_s=str(row.get("StartDateTime") or "")
              if "bornheim" in loc and start_s.startswith("2026-09-25T09:00"):
                  desc=row.get("ClassDescription") or {}
                  staff=row.get("Staff") or {}
                  remote.append({
                      "id":row.get("Id") or row.get("ID") or row.get("ClassId"),
                      "name":desc.get("Name") if isinstance(desc,dict) else row.get("Name"),
                      "staff":staff.get("DisplayName") or staff.get("Name"),
                      "start":start_s,
                      "capacity":row.get("MaxCapacity"),
                      "booked":row.get("TotalBooked"),
                      "web_capacity":row.get("WebCapacity"),
                      "is_available":row.get("IsAvailable"),
                  })
          print("MINDBODY_ROWS", json.dumps(remote,ensure_ascii=False,sort_keys=True))
          PY

          echo '--- api health after webhook diagnostics ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- api health after targeted reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
