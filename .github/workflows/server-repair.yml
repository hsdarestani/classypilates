name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- inspect live webhook route registration ---'
          cd /opt/classypilates
          echo 'LOCAL HEAD:'
          curl -si -X HEAD http://127.0.0.1:8787/api/integrations/mindbody/webhook || true
          echo 'LOCAL GET:'
          curl -si http://127.0.0.1:8787/api/integrations/mindbody/webhook || true
          echo 'ROUTES FROM RUNNING CODE:'
          docker compose exec -T api python - <<'PY'
          import runtime_app
          import mindbody_webhooks
          print("runtime_file", runtime_app.__file__)
          print("webhook_file", mindbody_webhooks.__file__)
          for r in runtime_app.app.router.routes:
              p=getattr(r,"path","")
              if "mindbody" in p or "integrations" in p:
                  print("ROUTE",p,sorted(getattr(r,"methods",[]) or []),getattr(r,"name",""))
          PY

          echo '--- api health after targeted reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
