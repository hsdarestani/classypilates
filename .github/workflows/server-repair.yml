name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- inspect and reconcile remaining Mindbody visit identities ---'
          docker compose exec -T api python - <<'PY'
          import json
          from sqlalchemy import select
          import main as core
          import mindbody_sync as mb

          targets = {
              "8123": "128893",
              "20601": "128892",
              "23354": "128862",
          }
          client = mb.WriteClient.from_env()

          for class_id, wanted_visit in targets.items():
              payload = client.get_class_visits(class_id)
              visits = mb._extract_class_visits(payload)
              visit = next(
                  (v for v in visits if str(mb._value(v,"Id","ID","VisitId","VisitID",default="") or "") == wanted_visit),
                  None,
              )
              print("REMOTE", json.dumps({
                  "class_id": class_id,
                  "visit_id": wanted_visit,
                  "found": bool(visit),
                  "client_id": str(mb._value(visit or {}, "ClientId","ClientID", default=mb._value((visit or {}).get("Client") or {},"Id","ID",default="")) or ""),
                  "cancelled": bool(mb._value(visit or {}, "Cancelled","IsCancelled","LateCancelled","EarlyCancelled",default=False)),
                  "has_client_object": bool((visit or {}).get("Client")),
                  "client_email": str(mb._value((visit or {}).get("Client") or {},"Email","email",default="") or ""),
              }, ensure_ascii=False, sort_keys=True))

              with core.SessionLocal() as db:
                  klass = db.scalar(select(core.ClassSession).where(core.ClassSession.mindbody_class_id == class_id))
                  print("LOCAL_BEFORE", json.dumps({
                      "class_id": class_id,
                      "local_class_id": getattr(klass,"id",None),
                      "status": getattr(klass,"status",None),
                      "capacity": getattr(klass,"capacity",None),
                      "imported": getattr(klass,"imported_bookings",None),
                      "source_total": getattr(klass,"source_bookings_total",None),
                  }, ensure_ascii=False, sort_keys=True))
                  if klass:
                      rows = db.scalars(select(core.Booking).where(core.Booking.class_id == klass.id)).all()
                      print("BOOKINGS_BEFORE", json.dumps([{
                          "id": b.id,
                          "source": b.source,
                          "status": b.status,
                          "visit_id": b.mindbody_visit_id,
                          "client_id": b.mindbody_client_id,
                          "email": b.email,
                          "sync": b.mindbody_sync_status,
                      } for b in rows], ensure_ascii=False, sort_keys=True))

              result = mb.reconcile_remote_class(
                  class_id,
                  reconcile_roster=True,
                  reconcile_waitlist=False,
                  sync_coach=False,
              )
              print("RECONCILE", class_id, json.dumps(result, ensure_ascii=False, sort_keys=True))

              with core.SessionLocal() as db:
                  klass = db.scalar(select(core.ClassSession).where(core.ClassSession.mindbody_class_id == class_id))
                  rows = db.scalars(select(core.Booking).where(core.Booking.class_id == klass.id)).all() if klass else []
                  print("LOCAL_AFTER", json.dumps({
                      "class_id": class_id,
                      "imported": getattr(klass,"imported_bookings",None),
                      "source_total": getattr(klass,"source_bookings_total",None),
                      "visit_ids": sorted(str(b.mindbody_visit_id or "") for b in rows if b.status=="reserved"),
                  }, ensure_ascii=False, sort_keys=True))
          PY

          echo '--- audit after targeted reconcile ---'
          docker compose exec -T api python mindbody_audit.py

          echo '--- api health after targeted reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
