name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- reconcile final pre-webhook roster drift ---'
          docker compose exec -T api python - <<'PY'
          import json
          import mindbody_sync as mb

          for class_id in ("26275", "29035", "23354"):
              result = mb.reconcile_remote_class(
                  class_id,
                  reconcile_roster=True,
                  reconcile_waitlist=False,
                  sync_coach=False,
              )
              print("RECONCILED", class_id, json.dumps(result, sort_keys=True))
          PY

          echo '--- final production Mindbody/Classy audit ---'
          docker compose exec -T api python mindbody_audit.py

          echo '--- webhook state ---'
          docker compose exec -T api python - <<'PY'
          import json, os
          import mindbody_webhooks as wh
          sid=(os.getenv("MINDBODY_WEBHOOK_SUBSCRIPTION_ID") or "").strip()
          row=next((x for x in wh._subscriptions() if str(x.get("subscriptionId") or x.get("SubscriptionId") or "") == sid), {})
          print("WEBHOOK", json.dumps({
              "configured": bool(sid and (os.getenv("MINDBODY_WEBHOOK_SIGNATURE_KEY") or "").strip()),
              "status": row.get("status") or row.get("Status"),
              "url": row.get("webhookUrl") or row.get("WebhookUrl"),
          }, sort_keys=True))
          PY

          echo '--- api health after webhook diagnostics ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- api health after targeted reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
