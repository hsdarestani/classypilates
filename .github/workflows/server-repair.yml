name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- reproduce webhook with TLS SNI and find duplicate nginx hosts ---'
          echo 'SNI LOCAL:'
          curl -ski --resolve classy.smarbiz.sbs:443:127.0.0.1 https://classy.smarbiz.sbs/api/integrations/mindbody/webhook || true
          echo 'ALL CLASSY SERVER_NAME OCCURRENCES:'
          nginx -T 2>&1 | grep -n -B8 -A30 'server_name classy\.smarbiz\.sbs' || true
          echo 'ENABLED SITES:'
          ls -la /etc/nginx/sites-enabled || true
          echo 'FILES CONTAINING DOMAIN:'
          grep -RIl 'server_name classy\.smarbiz\.sbs' /etc/nginx 2>/dev/null || true

          echo '--- api health after targeted reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
