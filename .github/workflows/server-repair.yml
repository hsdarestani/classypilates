name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- inspect public site schedule for screenshot classes ---'
          docker compose exec -T api python - <<'PY'
          import json, urllib.parse, urllib.request
          url='http://127.0.0.1:8000/api/schedule?'+urllib.parse.urlencode({
              'from':'2026-09-23',
              'to':'2026-09-24',
          })
          with urllib.request.urlopen(url, timeout=30) as r:
              payload=json.loads(r.read().decode())
          rows=payload if isinstance(payload,list) else payload.get('items') or payload.get('classes') or []
          wanted=[
              # Screenshot times are Europe/Berlin CEST (UTC+2 on Sep 23).
              ('mid-0800','mid','powerformer','06:00'),
              ('mid-1200','mid','powerformer','10:00'),
              ('mid-1800','mid','powerformer','16:00'),
              ('mid-1900','mid','powerformer','17:00'),
              ('mid-2000','mid','powerformer','18:00'),
              ('bornheim-0700','bornheim','total body level intense','05:00'),
              ('bornheim-0800','bornheim','total body level intense','06:00'),
              ('bornheim-1700','bornheim','total body level intense','15:00'),
              ('bornheim-1800','bornheim','total body level intense','16:00'),
              ('bornheim-1900','bornheim','butt & abs','17:00'),
          ]
          for label, studio, name_key, time_key in wanted:
              ms=[]
              for row in rows:
                  blob=json.dumps(row,ensure_ascii=False).casefold()
                  start=str(row.get('starts_at') or row.get('start') or row.get('start_time') or row.get('startsAt') or '')
                  if studio in blob and name_key in blob and (time_key in start or time_key in blob):
                      ms.append({
                          'id':row.get('id'),
                          'mindbody_class_id':row.get('mindbody_class_id'),
                          'title':row.get('title') or row.get('name'),
                          'coach':row.get('coach') or row.get('coach_name'),
                          'location':row.get('location') or row.get('studio'),
                          'starts_at':start,
                          'capacity':row.get('capacity'),
                          'reserved':row.get('reserved'),
                          'spots':row.get('spots'),
                          'spots_left':row.get('spots_left'),
                          'available':row.get('available'),
                      })
              print(label, json.dumps(ms,ensure_ascii=False,sort_keys=True))
          PY

          echo '--- api health after targeted reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
