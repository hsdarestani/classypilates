name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- inspect Bornheim 08 local row ---'
          docker compose exec -T api python - <<'PY'
          import json
          from sqlalchemy import select
          import main as core

          with core.SessionLocal() as db:
              row=db.scalar(select(core.ClassSession).where(core.ClassSession.mindbody_class_id=="21502"))
              if row:
                  print("ROW", json.dumps({
                      "id":row.id,
                      "mindbody_class_id":row.mindbody_class_id,
                      "title":row.title,
                      "studio_id":row.studio_id,
                      "starts_at":str(row.starts_at),
                      "status":row.status,
                      "capacity":row.capacity,
                      "imported_bookings":row.imported_bookings,
                      "source_bookings_total":row.source_bookings_total,
                      "coach":row.coach.display_name if row.coach else None,
                  }, ensure_ascii=False, sort_keys=True))
              else:
                  print("ROW null")

              rows=db.scalars(select(core.ClassSession).where(
                  core.ClassSession.studio_id=="bornheim",
                  core.ClassSession.starts_at >= "2026-09-23T05:30:00+00:00",
                  core.ClassSession.starts_at < "2026-09-23T06:30:00+00:00",
              )).all()
              for r in rows:
                  print("NEAR", json.dumps({
                      "id":r.id,"mb":r.mindbody_class_id,"title":r.title,
                      "start":str(r.starts_at),"status":r.status,
                      "capacity":r.capacity,"imported":r.imported_bookings,
                      "source_total":r.source_bookings_total,
                      "coach":r.coach.display_name if r.coach else None,
                  }, ensure_ascii=False, sort_keys=True))
          PY

          echo '--- api health after targeted reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
