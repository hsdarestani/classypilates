name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- force 7-day Mindbody roster reconcile ---'
          docker compose exec -T api python - <<'PY'
          import json
          import mindbody_sync
          result = mindbody_sync.sync_rosters_window(days=7)
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          if int(result.get("errors", 0)) or int(result.get("waitlist_errors", 0)):
              raise SystemExit(2)
          PY

          echo '--- production Mindbody/Classy audit ---'
          docker compose exec -T api python mindbody_audit.py

          echo '--- api health after roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
