name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- inspect Mid/Jane 18:00 Mindbody state ---'
          docker compose exec -T api python - <<'PY'
          import json
          import mindbody_sync as mb

          client = mb.WriteClient.from_env()
          rid = "19859"
          payload = client.get_classes(
              start_date_time="2026-09-23T17:30:00",
              end_date_time="2026-09-23T18:30:00",
              limit=100,
              offset=0,
          )
          rows = [x for x in mb._extract_list(payload, ("Classes","classes","Items")) if isinstance(x, dict)]
          row = next(x for x in rows if str(x.get("Id") or x.get("ID") or x.get("ClassId") or "") == rid)
          print("CLASS", json.dumps({
              k: row.get(k) for k in (
                  "Id","StartDateTime","MaxCapacity","WebCapacity","TotalBooked",
                  "TotalWebBooked","TotalWaitlisted","IsAvailable","IsCanceled"
              )
          }, ensure_ascii=False, sort_keys=True))

          vp = client.get_class_visits(rid)
          visits = mb._extract_class_visits(vp)
          print("VISIT_COUNT_ALL", len(visits))
          state_counts = {}
          for v in visits:
              flags = {
                  "Cancelled": v.get("Cancelled"),
                  "IsCancelled": v.get("IsCancelled"),
                  "LateCancelled": v.get("LateCancelled"),
                  "EarlyCancelled": v.get("EarlyCancelled"),
                  "SignedIn": v.get("SignedIn"),
                  "MakeUp": v.get("MakeUp"),
              }
              key = json.dumps(flags, sort_keys=True)
              state_counts[key] = state_counts.get(key, 0) + 1
          print("VISIT_STATES", json.dumps(state_counts, ensure_ascii=False, sort_keys=True))

          try:
              wait = client.get_waitlist_entries(class_id=rid)
          except Exception as exc:
              print("WAITLIST_ERROR", type(exc).__name__, str(exc)[:300])
              wait = []
          print("WAITLIST_COUNT", len(wait))
          print("WAITLIST_SAMPLE", json.dumps(wait[:5], ensure_ascii=False)[:3000])
          PY

          echo '--- api health after targeted reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
