name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- inspect public routing target ---'
          echo 'DNS:'
          getent ahostsv4 classy.smarbiz.sbs | head -5 || true
          echo 'LOCAL ADDRS:'
          hostname -I || true
          echo 'NGINX ACTIVE CONFIG FOR CLASSY:'
          nginx -T 2>/dev/null | awk '
            /server_name classy\.smarbiz\.sbs/ {show=1; count=0}
            show {print; count++}
            show && count>80 {show=0}
          ' | head -200
          echo 'HOST HEADER TO LOCAL NGINX:'
          curl -ski -H 'Host: classy.smarbiz.sbs' https://127.0.0.1/api/integrations/mindbody/webhook || true
          echo 'DIRECT API:'
          curl -si http://127.0.0.1:8787/api/integrations/mindbody/webhook || true

          echo '--- api health after targeted reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
