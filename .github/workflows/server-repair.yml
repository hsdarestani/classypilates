name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- test whether current deploy credentials reach public dns host ---'
          DNS_IP="$(getent ahostsv4 classy.smarbiz.sbs | awk 'NR==1{print $1}')"
          if SSHPASS="$PASS" sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 root@"$DNS_IP" 'echo PUBLIC_DNS_SSH_OK; test -d /opt/classypilates && echo PUBLIC_HAS_CLASSY=yes || echo PUBLIC_HAS_CLASSY=no' 2>/dev/null; then
            echo 'PUBLIC_DNS_SSH_WITH_CURRENT_PASS=yes'
          else
            echo 'PUBLIC_DNS_SSH_WITH_CURRENT_PASS=no'
          fi

          echo '--- api health after targeted reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
