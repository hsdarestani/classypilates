name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- identify stuck webhook event ---'
          docker compose exec -T api python - <<'PY'
          import json
          from sqlalchemy import text
          import main as core
          with core.engine.begin() as c:
              row=c.execute(text("""
                SELECT message_id,event_id,class_id,status,attempts,last_error,created_at,next_attempt_at,processed_at,payload
                FROM mindbody_webhook_events
                WHERE status='processing'
                ORDER BY created_at ASC
                LIMIT 1
              """)).mappings().first()
          if row:
              d=dict(row); d["payload"]=json.loads(d["payload"])
              print("PROCESSING_EVENT",json.dumps(d,default=str,sort_keys=True))
          else:
              print("PROCESSING_EVENT null")
          PY

          echo '--- confirm webhook queue keeps draining ---'
          docker compose exec -T api python - <<'PY'
          import json
          from sqlalchemy import text, select, func
          import main as core
          with core.engine.begin() as c:
              counts=c.execute(text("""
                SELECT status,COUNT(*) AS n,MIN(created_at) AS oldest,MAX(created_at) AS newest,MAX(processed_at) AS last_processed
                FROM mindbody_webhook_events GROUP BY status ORDER BY status
              """)).mappings().all()
              active=c.execute(text("""
                SELECT message_id,event_id,class_id,status,attempts,created_at
                FROM mindbody_webhook_events
                WHERE status IN ('processing','pending','failed')
                ORDER BY created_at ASC LIMIT 5
              """)).mappings().all()
          with core.SessionLocal() as db:
              latest=db.scalar(select(func.max(core.ClassSession.mindbody_synced_at)))
          print("QUEUE_FINAL",json.dumps([dict(x) for x in counts],default=str,sort_keys=True))
          print("QUEUE_OLDEST_OPEN",json.dumps([dict(x) for x in active],default=str,sort_keys=True))
          print("LATEST_SYNC_FINAL",latest.isoformat() if latest else None)
          PY

          echo '--- api health after webhook diagnostics ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- api health after targeted reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
