name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- inspect exact screenshot class candidates ---'
          docker compose exec -T api python - <<'PY'
          import json
          import mindbody_sync as mb

          client = mb.WriteClient.from_env()
          payload = client.get_classes(
              start_date_time="2026-09-23T00:00:00",
              end_date_time="2026-09-24T00:00:00",
              limit=300,
              offset=0,
          )
          rows = [x for x in mb._extract_list(payload, ("Classes","classes","Items")) if isinstance(x, dict)]

          checks = [
              ("mid-0800","mid","elena","2026-09-23T08:00"),
              ("mid-1200","mid","jane","2026-09-23T12:00"),
              ("mid-1800","mid","jane","2026-09-23T18:00"),
              ("mid-1900","mid","jane","2026-09-23T19:00"),
              ("mid-2000","mid","jane","2026-09-23T20:00"),
              ("bornheim-0700","bornheim","andrea","2026-09-23T07:00"),
              ("bornheim-0800","bornheim","andrea","2026-09-23T08:00"),
              ("bornheim-1700","bornheim","lana","2026-09-23T17:00"),
              ("bornheim-1800","bornheim","lana","2026-09-23T18:00"),
              ("bornheim-1900","bornheim","lana","2026-09-23T19:00"),
          ]

          for label, studio_key, coach_key, start_key in checks:
              matches=[]
              for row in rows:
                  loc = str((row.get("Location") or {}).get("Name") or "").casefold()
                  staff_obj=row.get("Staff") or {}
                  staff=str(staff_obj.get("DisplayName") or staff_obj.get("Name") or "").casefold()
                  start=str(row.get("StartDateTime") or row.get("startDateTime") or "")
                  if studio_key in loc and coach_key in staff and start.startswith(start_key):
                      desc=row.get("ClassDescription") or row.get("classDescription") or {}
                      name=(desc.get("Name") if isinstance(desc,dict) else None) or row.get("Name") or row.get("name")
                      matches.append({
                          "id":row.get("Id") or row.get("ID") or row.get("ClassId"),
                          "name":name,
                          "start":start,
                          "location":(row.get("Location") or {}).get("Name"),
                          "staff":(row.get("Staff") or {}).get("DisplayName"),
                          "capacity":row.get("MaxCapacity"),
                          "booked":row.get("TotalBooked"),
                          "web_capacity":row.get("WebCapacity"),
                          "is_available":row.get("IsAvailable"),
                      })
              print(label, json.dumps(matches, ensure_ascii=False, sort_keys=True))
          PY

          echo '--- api health after targeted reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
