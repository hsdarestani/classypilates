name: Repair Classy Production Server

on:
  workflow_dispatch:
  push:
    branches:
      - ops/oneoff-roster-reconcile
    paths:
      - .github/workflows/server-repair.yml

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reconcile Mindbody rosters and verify production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@$HOST 'bash -s' <<'REMOTE'
          set -e

          cd /opt/classypilates
          echo '--- api health before roster reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health

          echo '--- compare dns target with deploy host routing ---'
          DNS_IP="$(getent ahostsv4 classy.smarbiz.sbs | awk 'NR==1{print $1}')"
          if hostname -I | tr ' ' '\n' | grep -Fxq "$DNS_IP"; then
            echo 'DNS_IS_LOCAL_ADDRESS=yes'
          else
            echo 'DNS_IS_LOCAL_ADDRESS=no'
          fi
          echo 'PUBLIC URL FROM DEPLOY HOST:'
          curl -ski --max-time 20 https://classy.smarbiz.sbs/api/integrations/mindbody/webhook | head -20 || true
          echo 'PUBLIC URL FORCED TO LOCAL:'
          curl -ski --resolve classy.smarbiz.sbs:443:127.0.0.1 https://classy.smarbiz.sbs/api/integrations/mindbody/webhook | head -20 || true

          echo '--- api health after targeted reconcile ---'
          curl -fsS http://127.0.0.1:8787/api/health
          REMOTE
