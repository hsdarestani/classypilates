name: Restore Legacy WordPress Media

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH helper
        run: sudo apt-get update && sudo apt-get install -y sshpass curl

      - name: Add legacy media proxy and verify
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PASS"
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          FILE=/etc/nginx/snippets/classy-routes.conf
          test -f "$FILE"

          if ! grep -q 'location \^~ /wp-content/' "$FILE"; then
            cat >> "$FILE" <<'NGINX'

              # Temporary compatibility bridge for media that still lives on the
              # legacy WordPress host after the apex-domain cutover.
              location ^~ /wp-content/ {
                  proxy_pass https://81.88.34.82;
                  proxy_http_version 1.1;
                  proxy_set_header Host classypilates.de;
                  proxy_ssl_server_name on;
                  proxy_ssl_name classypilates.de;
                  proxy_ssl_verify off;
                  proxy_set_header Connection "";
                  proxy_buffering on;
                  proxy_cache_valid 200 1h;
              }
          NGINX
          fi

          nginx -t
          systemctl reload nginx

          curl -kfsS --resolve classypilates.de:443:127.0.0.1             -o /dev/null             https://classypilates.de/wp-content/uploads/2026/05/Ladies_02-scaled.jpg
          echo "Legacy WordPress media proxy is working."
          REMOTE
