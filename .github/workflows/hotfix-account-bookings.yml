name: Hotfix Account Bookings

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-account-bookings.yml"

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Upload fixed account script
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          sshpass -e scp -o StrictHostKeyChecking=no public/account.js root@"$HOST":/opt/classypilates/public/account.js
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" "python3 -c \"from pathlib import Path; c=Path('/opt/classypilates/public/account.js').read_text(); assert \\\"\\$\\$('[data-cancel]')\\\" in c; print('account_selector_hotfix_verified')\""
