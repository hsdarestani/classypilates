name: Hotfix Account Bookings

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-account-bookings.yml"

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Upload fixed account script
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          LOCAL_SHA="$(sha256sum public/account.js | awk '{print $1}')"
          sshpass -e scp -o StrictHostKeyChecking=no public/account.js root@"$HOST":/opt/classypilates/public/account.js
          REMOTE_SHA="$(sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" "sha256sum /opt/classypilates/public/account.js | awk '{print \\$1}'")"
          test "$LOCAL_SHA" = "$REMOTE_SHA"
          echo "account_script_hotfix_verified"
