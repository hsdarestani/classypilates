name: Enable Classy Primary Domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enable-primary-domain.yml"

permissions:
  contents: read

concurrency:
  group: classy-primary-domain-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Install DNS and SSH tools
        run: sudo apt-get update && sudo apt-get install -y dnsutils sshpass curl

      - name: Wait for primary DNS
        env:
          HOST: ${{ secrets.HOST }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          for i in $(seq 1 36); do
            APEX_CF="$(dig @1.1.1.1 +short A classypilates.de | sort -u)"
            APEX_GOOGLE="$(dig @8.8.8.8 +short A classypilates.de | sort -u)"
            WWW_CF="$(dig @1.1.1.1 +short A www.classypilates.de | sort -u)"
            echo "Attempt $i"
            echo "apex via Cloudflare: $APEX_CF"
            echo "apex via Google: $APEX_GOOGLE"
            echo "www via Cloudflare: $WWW_CF"
            if printf '%s\n%s\n' "$APEX_CF" "$APEX_GOOGLE" | grep -Fxq "$HOST"; then
              exit 0
            fi
            sleep 10
          done
          echo "classypilates.de has not propagated to the production server yet." >&2
          exit 2

      - name: Issue TLS and activate primary domain
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PASS"
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          if ! command -v certbot >/dev/null 2>&1; then
            apt-get update
            apt-get install -y certbot python3-certbot-nginx
          fi
          test -f /etc/nginx/snippets/classy-routes.conf

          # Remove the old HTTP-only apex preview block from the new-domain vhost.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/etc/nginx/sites-available/new.classypilates.de')
          if p.exists():
              s=p.read_text()
              marker='# Prepared in advance for the future apex-domain cutover.'
              if marker in s:
                  s=s.split(marker,1)[0].rstrip()+"\n"
                  p.write_text(s)
          PY

          cat > /etc/nginx/sites-available/classypilates-primary <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name classypilates.de www.classypilates.de;
              include /etc/nginx/snippets/classy-routes.conf;
          }
          NGINX

          ln -sfn /etc/nginx/sites-available/classypilates-primary /etc/nginx/sites-enabled/classypilates-primary
          nginx -t
          systemctl reload nginx

          WWW_IP="$(getent ahostsv4 www.classypilates.de 2>/dev/null | awk '{print $1}' | head -n1 || true)"
          THIS_IP="$(getent ahostsv4 classypilates.de 2>/dev/null | awk '{print $1}' | head -n1 || true)"
          if [ -n "$WWW_IP" ] && [ "$WWW_IP" = "$THIS_IP" ]; then
            certbot --nginx -d classypilates.de -d www.classypilates.de --non-interactive --agree-tos --register-unsafely-without-email --redirect --keep-until-expiring
          else
            certbot --nginx -d classypilates.de --non-interactive --agree-tos --register-unsafely-without-email --redirect --keep-until-expiring
          fi

          nginx -t
          systemctl reload nginx
          curl -fsSL --max-time 30 -o /tmp/classy-primary-health.json https://classypilates.de/api/health
          grep -q '"ok":true' /tmp/classy-primary-health.json
          REMOTE

      - name: Verify primary HTTPS
        run: |
          set -euo pipefail
          curl -fsSIL --max-time 30 https://classypilates.de/ >/dev/null
          curl -fsSL --max-time 30 -o /tmp/health.json https://classypilates.de/api/health
          grep -q '"ok":true' /tmp/health.json
          echo "classypilates.de HTTPS is live."
