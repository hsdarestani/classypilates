name: Reconcile verified prior Oval SumUp sale (one-time)
on:
  push:
    branches: [main]
    paths: [".github/workflows/reconcile-verified-oval-single.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile-one:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install SSH utility
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Carefully reconcile one already-paid Oval reservation
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PASS"
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=20 root@"$HOST" 'cd /opt/classypilates && docker compose exec -T api python -' <<'PY'
          from sqlalchemy import select
          import main as core
          import mindbody_sync as mb

          ORDER_ID = 369
          print("TARGET_ORDER_ID", ORDER_ID)
          with core.SessionLocal() as db:
              order = db.get(core.PaymentOrder, ORDER_ID)
              if not order or not order.booking_reference:
                  raise SystemExit("SKIP: order not found")
              booking = db.scalar(select(core.Booking).where(
                  core.Booking.reference == order.booking_reference
              ))
              if not booking:
                  raise SystemExit("SKIP: linked booking not found")
              if order.mindbody_sale_status == "synced":
                  print("SKIP: already synced — no provider sale attempted")
                  raise SystemExit(0)
              if not (order.status == "paid" and order.provider == "sumup"
                      and bool(order.provider_payment_id)
                      and int(order.amount_cents) == 2800
                      and not order.mindbody_sale_id
                      and booking.status == "reserved"
                      and booking.source == "website"
                      and booking.payment_status == "paid"
                      and booking.payment_method == "sumup"
                      and int(booking.amount_cents) == 2800
                      and booking.mindbody_sync_status == "synced"
                      and booking.klass.studio_id == "oval"
                      and bool(booking.mindbody_visit_id)
                      and bool(booking.mindbody_client_id)
                      and bool(booking.klass.mindbody_class_id)
                      and order.mindbody_sale_status == "manual_review"
                      and ("pricing" in str(order.mindbody_sale_error).lower()
                           or "No provided services" in str(order.mindbody_sale_error))):
                  raise SystemExit("SKIP: local SumUp/payment/identity prerequisites not met")
              provider_class = str(booking.klass.mindbody_class_id)
              provider_client = str(booking.mindbody_client_id)
              provider_visit = str(booking.mindbody_visit_id)
              local_studio = booking.klass.studio_id
              local_title = booking.klass.title
          client = mb.WriteClient.from_env(timeout=20.0)
          visits = mb._active_client_visits(
              client, class_id=provider_class, client_id=provider_client
          )
          if not (len(visits) == 1
                  and mb._visit_id(visits[0]) == provider_visit
                  and not any(mb._visit_service_identity(visits[0]))):
              raise SystemExit("SKIP: provider visit absent/paid/ambiguous — no sale attempted")
          location = mb._resolve_location(client, local_studio, local_title)
          locid = str(mb._value(location, "Id", "ID", "LocationId", default="") or "")
          if not locid:
              raise SystemExit("SKIP: unable to map provider location")
          options = client.get_sale_services_for_class(provider_class, locid)
          selected = mb._pick_single_class_service(options, amount_cents=2800)
          optionid = str(mb._value(selected, "Id", "ID", default="") or "")
          if optionid != "100072":
              raise SystemExit("SKIP: expected Oval option 100072 is not class eligible")
          print("PREFLIGHT_OK: one unpaid existing visit, confirmed local SumUp Paid, correct Oval pricing option")
          # The reconciliation code already locks and verifies payment/visit before
          # CheckoutShoppingCart, but first retry a previously pricing-blocked order.
          with core.SessionLocal() as db:
              order = db.scalar(select(core.PaymentOrder).where(
                  core.PaymentOrder.id == ORDER_ID
              ).with_for_update())
              booking = db.scalar(select(core.Booking).where(
                  core.Booking.reference == order.booking_reference
              ).with_for_update())
              if not (order.mindbody_sale_status == "manual_review"
                      and order.status == "paid"
                      and order.provider_payment_id
                      and not order.mindbody_sale_id
                      and ("pricing" in str(order.mindbody_sale_error).lower()
                           or "No provided services" in str(order.mindbody_sale_error))
                      and booking.status == "reserved"
                      and booking.payment_status == "paid"):
                  raise SystemExit("SKIP: order changed during preflight")
              order.mindbody_sale_status = "pending"
              order.mindbody_sale_error = ""
              db.commit()
          success = mb.reconcile_paid_booking_sale(ORDER_ID)
          with core.SessionLocal() as db:
              final = db.get(core.PaymentOrder, ORDER_ID)
              print("RECONCILE_RESULT", "SUCCESS" if success else "NOT_CONFIRMED")
              print("FINAL_SALE_STATUS", final.mindbody_sale_status)
              print("SALE_ID_PRESENT", bool(final.mindbody_sale_id))
              print("PRICING_OPTION_ID", final.mindbody_service_id)
              if final.mindbody_sale_status != "synced":
                  raise SystemExit("NEEDS_MANUAL_REVIEW: no further automatic retries")
          PY
