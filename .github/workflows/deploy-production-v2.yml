name: Deploy Classy Production v2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classy-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Upload current release
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          test -n "$HOST" && test -n "$PASS"
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 root@"$HOST" 'mkdir -p /opt/classypilates'
          sshpass -e rsync -az --delete \
            --exclude='.git' --exclude='.env' --exclude='__pycache__' \
            -e 'ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12' \
            ./ root@"$HOST":/opt/classypilates/

      - name: Rebuild and restart app
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/classypilates
          test -f .env
          docker compose up -d --build --remove-orphans
          for i in $(seq 1 45); do
            if curl -fsS --max-time 5 http://127.0.0.1:8787/api/health | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=120 api
          exit 1
          REMOTE

      - name: Verify new production domain
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL --max-time 10 https://new.classypilates.de/api/health | grep -q '"ok":true'; then
              break
            fi
            sleep 3
          done
          curl -fsSL --max-time 15 https://new.classypilates.de/api/health | grep -q '"ok":true'
          curl -fsSL --max-time 15 https://new.classypilates.de/site-fix.css | grep -q 'brand-action-icon'
          curl -fsSL --max-time 15 https://new.classypilates.de/client-feedback.js | grep -q 'iconWhatsapp'
