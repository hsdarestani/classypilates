name: Inspect Mindbody Commerce

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mindbody-commerce-discovery.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Map sellable pricing options by location without changing data
        env:
          API_KEY: ${{ secrets.MINDBODY_API_KEY }}
          SITE_ID: ${{ secrets.MINDBODY_SITE_ID }}
          STAFF_USERNAME: ${{ secrets.MINDBODY_STAFF_USERNAME }}
          STAFF_PASSWORD: ${{ secrets.MINDBODY_STAFF_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$API_KEY" && test -n "$SITE_ID"
          test -n "$STAFF_USERNAME" && test -n "$STAFF_PASSWORD"
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          base = "https://api.mindbodyonline.com/public/v6"
          api_key, site_id = os.environ["API_KEY"], os.environ["SITE_ID"]
          common = {"API-Key": api_key, "SiteId": site_id, "Accept": "application/json"}

          body = json.dumps({"Username": os.environ["STAFF_USERNAME"], "Password": os.environ["STAFF_PASSWORD"]}).encode()
          req = urllib.request.Request(base + "/usertoken/issue", data=body, method="POST",
              headers={**common, "Content-Type": "application/json"})
          with urllib.request.urlopen(req, timeout=30) as res:
              token_data = json.load(res)
          token = token_data.get("AccessToken") or token_data.get("accessToken") or token_data.get("Token")
          if not token:
              raise SystemExit("No user token returned")
          auth = {**common, "Authorization": "Bearer " + token}

          def get(path, params=None):
              query = "?" + urllib.parse.urlencode(params or {}) if params else ""
              with urllib.request.urlopen(urllib.request.Request(base + path + query, headers=auth), timeout=30) as res:
                  return json.load(res)

          locations = get("/site/locations").get("Locations", [])
          wanted = {"1 Class", "5 Classes", "10 Classes", "20 Classes"}
          for loc in locations:
              lid, lname = loc.get("Id"), loc.get("Name", "")
              services = get("/sale/services", {"OnlineOnly": "true", "LocationId": lid}).get("Services", [])
              matches = []
              for row in services:
                  name = str(row.get("Name") or "").strip()
                  if name in wanted:
                      matches.append({
                          "id": row.get("Id"), "name": name,
                          "price": row.get("OnlinePrice", row.get("Price")),
                          "count": row.get("Count")
                      })
              print(json.dumps({"location_id": lid, "location": lname, "pricing_options": matches}, ensure_ascii=False))
          PY
