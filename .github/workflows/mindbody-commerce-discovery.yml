name: Inspect Mindbody Commerce

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read sellable pricing options without changing data
        env:
          API_KEY: ${{ secrets.MINDBODY_API_KEY }}
          SITE_ID: ${{ secrets.MINDBODY_SITE_ID }}
          STAFF_USERNAME: ${{ secrets.MINDBODY_STAFF_USERNAME }}
          STAFF_PASSWORD: ${{ secrets.MINDBODY_STAFF_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$API_KEY" && test -n "$SITE_ID"
          test -n "$STAFF_USERNAME" && test -n "$STAFF_PASSWORD"

          TOKEN_STATUS="$(curl -sS -o /tmp/token.json -w '%{http_code}' \
            -X POST -H "API-Key: $API_KEY" -H "SiteId: $SITE_ID" \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data "$(jq -n --arg u "$STAFF_USERNAME" --arg p "$STAFF_PASSWORD" '{Username:$u,Password:$p}')" \
            'https://api.mindbodyonline.com/public/v6/usertoken/issue')"
          test "$TOKEN_STATUS" = "200"
          TOKEN="$(jq -r '.AccessToken // .accessToken // .Token // .token // empty' /tmp/token.json)"
          test -n "$TOKEN"
          rm -f /tmp/token.json

          SERVICES_STATUS="$(curl -sS -o /tmp/services.json -w '%{http_code}' \
            -H "API-Key: $API_KEY" -H "SiteId: $SITE_ID" \
            -H "Authorization: Bearer $TOKEN" -H 'Accept: application/json' \
            'https://api.mindbodyonline.com/public/v6/sale/services?OnlineOnly=true')"
          unset TOKEN
          if [ "$SERVICES_STATUS" != "200" ]; then
            echo "Mindbody services lookup failed with HTTP $SERVICES_STATUS" >&2
            jq -c '{Error:(.Error // .error // "unknown")}' /tmp/services.json >&2 || true
            exit 3
          fi

          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/services.json', encoding='utf-8'))
          rows = data.get('Services') or data.get('services') or data.get('Items') or []
          print(f"Sellable Mindbody pricing options: {len(rows)}")
          for row in rows:
              if not isinstance(row, dict):
                  continue
              service_id = row.get('Id') or row.get('ID') or row.get('id')
              name = row.get('Name') or row.get('name') or ''
              price = row.get('Price') or row.get('price')
              online = row.get('OnlinePrice') or row.get('onlinePrice')
              count = row.get('Count') or row.get('count')
              program = row.get('Program') or row.get('program') or {}
              program_name = program.get('Name') if isinstance(program, dict) else ''
              print(json.dumps({
                  'id': service_id,
                  'name': name,
                  'price': price,
                  'online_price': online,
                  'count': count,
                  'program': program_name,
              }, ensure_ascii=False))
          PY
