name: Inspect Classy Email DNS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-email-dns.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install DNS tools
        run: sudo apt-get update && sudo apt-get install -y dnsutils
      - name: Inspect authentication records
        run: |
          set -e
          echo "=== SPF/TXT ==="
          dig +short TXT classypilates.de
          echo "=== DMARC ==="
          dig +short TXT _dmarc.classypilates.de
          echo "=== MX ==="
          dig +short MX classypilates.de
          echo "=== NS ==="
          dig +short NS classypilates.de
          echo "=== DOMAINKEY ROOT ==="
          dig +short TXT _domainkey.classypilates.de
          echo "=== Common DKIM selectors ==="
          for s in default mail smtp selector1 selector2 alfahosting dkim; do
            echo "-- $s --"
            dig +short TXT "$s._domainkey.classypilates.de"
            dig +short CNAME "$s._domainkey.classypilates.de"
          done
