name: Migrate Legacy Admin Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-admin-once.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH helper
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Migrate the existing administrator record
        env:
          OLD_HOST: ${{ secrets.OLD_HOST }}
          OLD_PASS: ${{ secrets.OLD_PASS }}
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$OLD_HOST" && test -n "$OLD_PASS" && test -n "$HOST" && test -n "$PASS"
          OLD_SCRIPT_B64=''
          NEW_SCRIPT_B64=''
          export SSHPASS="$OLD_PASS"
          ADMIN_PAYLOAD_B64="$(sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$OLD_HOST" "cd /opt/classypilates && printf '%s' '$OLD_SCRIPT_B64' | base64 -d | docker compose exec -T api python -")"
          test -n "$ADMIN_PAYLOAD_B64"
          echo "::add-mask::$ADMIN_PAYLOAD_B64"
          export SSHPASS="$PASS"
          RESULT="$(sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$HOST" "cd /opt/classypilates && ADMIN_PAYLOAD_B64='$ADMIN_PAYLOAD_B64' bash -c \"printf '%s' '$NEW_SCRIPT_B64' | base64 -d | docker compose exec -T -e ADMIN_PAYLOAD_B64 api python -\"")"
          printf '%s\n' "$RESULT"
          printf '%s' "$RESULT" | grep -q '"ok": true'
          printf '%s' "$RESULT" | grep -q '"admin_count": 1'
