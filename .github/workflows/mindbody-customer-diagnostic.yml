name: Classy Local Payment Diagnostic (No Provider Calls)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mindbody-customer-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install SSH client
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null

      - name: Examine local Anna reservation and failed cancellations only
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PASS"
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/classypilates
          echo "=== ANNA LOCAL RESERVATIONS (no Mindbody API used) ==="
          docker compose exec -T db sh -lc 'psql -X -qAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          SELECT concat_ws(' | ',
            'class_date=' || to_char(c.starts_at AT TIME ZONE 'Europe/Berlin','YYYY-MM-DD HH24:MI'),
            'source=' || coalesce(b.source,''),
            'booking=' || coalesce(b.status,''),
            'payment_method=' || coalesce(b.payment_method,''),
            'payment=' || coalesce(b.payment_status,''),
            'provider_hold=' || coalesce(b.mindbody_sync_status,''),
            'visit_linked=' || (b.mindbody_visit_id IS NOT NULL),
            'class_linked=' || (c.mindbody_class_id IS NOT NULL),
            'order=' || coalesce(po.status,'none'),
            'sumup_linked=' || (po.provider_payment_id IS NOT NULL),
            'sale=' || coalesce(po.mindbody_sale_status,'none'),
            'sale_error=' || (length(coalesce(po.mindbody_sale_error,'')) > 0),
            'hold_error=' || (length(coalesce(b.mindbody_sync_error,'')) > 0)
          )
          FROM bookings b
          JOIN classes c ON c.id = b.class_id
          LEFT JOIN LATERAL (
            SELECT po.* FROM payment_orders po
            WHERE po.booking_reference=b.reference
            ORDER BY po.id DESC LIMIT 1
          ) po ON TRUE
          WHERE lower(coalesce(b.customer_name,'')) LIKE '%nuzzolo%'
          ORDER BY c.starts_at DESC
          LIMIT 25;
          SQL
          echo "=== ANNA RECONCILIATION ERROR CATEGORY (redacted) ==="
          docker compose exec -T db sh -lc 'psql -X -qAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          SELECT concat_ws(' | ',
            'sale_error_redacted=' || left(
              regexp_replace(regexp_replace(regexp_replace(
                coalesce(po.mindbody_sale_error,''),
                '[[:alnum:]._%+]+@[[:alnum:].-]+', '[EMAIL]', 'g'),
                '[[:digit:]]+', '#', 'g'),
                '(?i)(anna|nuzzolo)', '[NAME]', 'g'), 380),
            'attempts=' || coalesce(r.attempts::text,'none'),
            'last_attempt=' || coalesce(to_char(r.last_attempt_at AT TIME ZONE 'Europe/Berlin','YYYY-MM-DD HH24:MI'), 'none')
          )
          FROM bookings b JOIN classes c ON c.id=b.class_id
          JOIN payment_orders po ON po.booking_reference=b.reference
          LEFT JOIN mindbody_paid_sale_recovery r ON r.order_id=po.id
          WHERE lower(b.customer_name) LIKE '%nuzzolo%'
            AND c.starts_at >= '2026-10-17' AND c.starts_at < '2026-10-20'
          ORDER BY b.id DESC LIMIT 3;
          SQL
          echo "=== FAILED CANCELLATION ERROR CATEGORY (redacted) ==="
          docker compose exec -T db sh -lc 'psql -X -qAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          SELECT left(
            regexp_replace(regexp_replace(coalesce(mindbody_sync_error,''),
            '[[:alnum:]._%+]+@[[:alnum:].-]+', '[EMAIL]', 'g'),
            '[[:digit:]]+', '#', 'g'),
            280)
          FROM bookings WHERE mindbody_sync_status='cancel_failed'
          ORDER BY created_at DESC LIMIT 2;
          SQL
          echo "=== PRODUCTION RECOVERY WORKER STATUS ==="
          docker compose exec -T api python - <<'PY'
          import os, threading
          import mindbody_sync as mb
          try:
              import mindbody_paid_recovery as worker
              print({
                  "recovery_module_exists": True,
                  "recovery_configured": worker._ready(),
                  "sync_enabled": mb.SYNC_ENABLED,
                  "bulk_sync_enabled": mb.BACKGROUND_SYNC_ENABLED,
                  "worker_thread_exists": any(t.name=="mindbody-paid-recovery" for t in threading.enumerate()),
              })
          except Exception as e:
              print({"recovery_module_exists": False, "error_type": type(e).__name__})
          PY
          echo "=== PAYMENT RECOVERY LOGS (non-sensitive lines) ==="
          docker compose logs --since 35m api 2>&1 | grep -E 'payment recovery|payment reconciliation|Mindbody paid' | tail -12 | sed -E 's/[[:digit:]]{6,}/[ID]/g' || true
          echo "=== BOUNDED RETRY ELIGIBILITY (LOCAL DATABASE) ==="
          docker compose exec -T db sh -lc 'psql -X -qAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          SELECT concat_ws(' | ',
             'today_total_attempts='||(SELECT COUNT(*) FROM mindbody_paid_sale_recovery WHERE last_attempt_at >= date_trunc('day',now())),
             'queued_paid_future='||(SELECT count(*) FROM payment_orders po JOIN bookings b ON b.reference=po.booking_reference JOIN classes c ON c.id=b.class_id WHERE po.status='paid' AND po.mindbody_sale_status IN ('','pending','failed') AND b.status='reserved' AND c.starts_at > now() AND b.payment_method='sumup')
          );
          SELECT concat_ws(' | ',
            'provider='||coalesce(po.provider,''),
            'paid_order_age_minutes='||floor(extract(epoch from (now() - po.created_at))/60),
            'last_updated_age_minutes='||floor(extract(epoch from (now() - po.updated_at))/60),
            'client_linked='||(b.mindbody_client_id IS NOT NULL),
            'order_amount_matches='||(po.amount_cents=b.amount_cents),
            'created_since_cutoff='||(po.created_at>='2026-09-26'::timestamp),
            'class_future='||(c.starts_at >= now()-interval '1 day')
          ) FROM bookings b JOIN classes c ON c.id=b.class_id JOIN payment_orders po ON po.booking_reference=b.reference
          WHERE lower(b.customer_name) LIKE '%nuzzolo%' AND c.starts_at BETWEEN '2026-10-17' AND '2026-10-20' LIMIT 2;
          SQL
          echo "=== FAILED LOCAL CANCELLATIONS ==="
          docker compose exec -T db sh -lc 'psql -X -qAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          SELECT concat_ws(' | ',
            'age_days=' || floor(extract(epoch from (now() - b.created_at))/86400),
            'source=' || coalesce(b.source,''),
            'booking=' || coalesce(b.status,''),
            'payment=' || coalesce(b.payment_status,''),
            'linked=' || (b.mindbody_visit_id IS NOT NULL),
            'class_date=' || to_char(c.starts_at AT TIME ZONE 'Europe/Berlin','YYYY-MM-DD HH24:MI'),
            'error_kind=' || CASE
              WHEN lower(b.mindbody_sync_error) LIKE '%invalid user token%' THEN 'token'
              WHEN lower(b.mindbody_sync_error) LIKE '%not found%' THEN 'not_found'
              WHEN lower(b.mindbody_sync_error) LIKE '%visit%' THEN 'visit'
              WHEN lower(b.mindbody_sync_error) LIKE '%timeout%' THEN 'timeout'
              WHEN lower(b.mindbody_sync_error) LIKE '%unauthorized%' THEN 'auth'
              ELSE 'other' END
          )
          FROM bookings b JOIN classes c ON c.id=b.class_id
          WHERE b.mindbody_sync_status='cancel_failed'
          ORDER BY b.created_at DESC LIMIT 5;
          SQL
          echo "=== END LOCAL DIAGNOSTIC ==="
          REMOTE
