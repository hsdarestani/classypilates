name: Inspect Hold Cleanup Logs

on:
  push:
    branches: [fix/mindbody-sumup-reconciliation]
    paths:
      - ".github/workflows/inspect-hold-cleanup-logs.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Read cleanup logs
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 root@"$HOST"             'cd /opt/classypilates && docker compose logs --since=36h api 2>&1 | grep -Ei "stale booking|abandoned SumUp|released .*hold|booking hold cleanup|Mindbody mirror cycle failed" | tail -n 300 || true'
