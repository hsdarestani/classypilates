name: Classy Payment CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        run: |
          python -m py_compile server/*.py
          for file in public/*.js; do node --check "$file"; done
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          public = Path("public")
          required = [
              "index.html", "shop.html", "login.html", "account.html",
              "robots.txt", "sitemap.xml",
          ]
          missing = [name for name in required if not (public / name).is_file()]
          if missing:
              raise SystemExit(f"Missing production assets: {', '.join(missing)}")
          ElementTree.parse(public / "sitemap.xml")
          PY

      - name: Mindbody availability regression guard
        env:
          DATABASE_URL: sqlite:////tmp/classy-availability-guard.db
          UPLOAD_DIR: /tmp/classy-availability-uploads
        run: python server/availability_regression_guard.py

      - name: Reject duplicate FastAPI routes
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          files = [Path("server/main.py"), Path("server/feedback_app.py"), Path("server/runtime_app.py")]
          seen = {}
          duplicates = []
          pattern = re.compile(r'@(?:app|core\.app)\.(get|post|put|patch|delete)\("([^"]+)"')
          for path in files:
              text = path.read_text(encoding="utf-8")
              for method, route in pattern.findall(text):
                  key = (method.upper(), route)
                  if key in seen:
                      duplicates.append((key, seen[key], str(path)))
                  else:
                      seen[key] = str(path)
          if duplicates:
              for (method, route), first, second in duplicates:
                  print(f"Duplicate route: {method} {route} in {first} and {second}")
              raise SystemExit(1)
          print(f"FastAPI route uniqueness OK: {len(seen)} routes")
          PY

      - name: Diff check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git diff --check "origin/$BASE_REF...HEAD"
          else
            git diff --check
          fi

      - name: Runtime payment guardrails
        run: |
          if grep -RIni --exclude-dir=.git --include='*.py' --include='*.js' --include='*.html' --include='*.css' 'stripe' server public; then
            echo 'Stripe runtime references remain.' >&2
            exit 1
          fi
          if grep -Ein 'PRESENTATION_PAYMENT|Payment is simulated|No real charge|Confirm demo payment|completeDemoBooking' public/booking-flow.js; then
            echo 'Demo booking payment flow remains.' >&2
            exit 1
          fi
          if grep -Ein 'savePreparedOrder|provider_not_connected|Checkout ready|No charge is made until then' public/shop.js; then
            echo 'Fake shop checkout fallback remains.' >&2
            exit 1
          fi
