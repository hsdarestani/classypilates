name: Bootstrap Classy Production Server

on:
  workflow_dispatch:
  push:
    branches: [server-bootstrap]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Prepare fresh Ubuntu server
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PASS"
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          if [ ! -f /etc/os-release ]; then
            echo "Cannot identify operating system." >&2
            exit 1
          fi
          . /etc/os-release
          if [ "${ID:-}" != "ubuntu" ]; then
            echo "Expected Ubuntu, found ${PRETTY_NAME:-unknown}." >&2
            exit 1
          fi

          apt-get update
          apt-get install -y ca-certificates curl openssl nginx certbot python3-certbot-nginx

          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://get.docker.com | sh
          fi
          if ! docker compose version >/dev/null 2>&1; then
            apt-get update
            apt-get install -y docker-compose-plugin
          fi

          systemctl enable --now docker

          # Initialize persistent application secrets before touching the web server.
          mkdir -p /opt/classypilates
          cd /opt/classypilates
          touch .env

          ensure_value() {
            key="$1"
            value="$2"
            if ! grep -q "^${key}=" .env; then
              printf '%s=%s\n' "$key" "$value" >> .env
            fi
          }

          ensure_secret() {
            key="$1"
            bytes="$2"
            current="$(sed -n "s/^${key}=//p" .env | head -n1)"
            if [ -z "$current" ]; then
              sed -i "/^${key}=/d" .env
              printf '%s=%s\n' "$key" "$(openssl rand -hex "$bytes")" >> .env
            fi
          }

          ensure_value POSTGRES_DB classy
          ensure_value POSTGRES_USER classy
          ensure_secret POSTGRES_PASSWORD 24
          ensure_secret JWT_SECRET 32
          ensure_value JWT_TTL_HOURS 24
          chmod 600 .env

          echo "=== Port 80 before nginx ==="
          ss -ltnp | grep -E '(:80[[:space:]])' || true
          command -v lsof >/dev/null 2>&1 && lsof -nP -iTCP:80 -sTCP:LISTEN || true

          # Alfahosting images may have Apache/lighttpd enabled by default.
          # This server is dedicated to Classy, so disable only these known
          # conflicting web servers. Unknown listeners are left untouched.
          if systemctl is-active --quiet apache2; then
            echo "Disabling default Apache on port 80"
            systemctl disable --now apache2
          fi
          if systemctl is-active --quiet lighttpd; then
            echo "Disabling default lighttpd on port 80"
            systemctl disable --now lighttpd
          fi

          if ss -ltnp | grep -E '(:80[[:space:]])' >/dev/null 2>&1; then
            echo "Port 80 is still occupied by an unknown service; refusing to stop it automatically." >&2
            ss -ltnp | grep -E '(:80[[:space:]])' >&2 || true
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}' >&2 || true
            exit 2
          fi

          systemctl enable nginx
          systemctl restart nginx
          nginx -t

          echo "Ubuntu: ${PRETTY_NAME}"
          docker --version
          docker compose version
          nginx -v
          echo "Base production secrets initialized in /opt/classypilates/.env"
          echo "Bootstrap complete"
          REMOTE
