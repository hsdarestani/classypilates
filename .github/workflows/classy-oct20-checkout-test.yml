name: Classy Oct 20 Mindbody TEST Checkout Only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/classy-oct20-checkout-test.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install SSH
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Test an existing paid SumUp reservation without creating a sale
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          test -n "$HOST" && test -n "$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/classypilates
          docker compose exec -T api python - <<'PY'
          import re
          from datetime import datetime
          from sqlalchemy import select
          import main as core
          from mindbody_sync import WriteClient, _resolve_location, _value, _active_client_visits, _visit_id, _visit_service_identity
          with core.SessionLocal() as db:
              booking = db.scalar(
                  select(core.Booking).join(core.ClassSession, core.Booking.class_id == core.ClassSession.id)
                  .where(core.Booking.customer_name.ilike('%Olga%'),
                         core.ClassSession.starts_at >= datetime.fromisoformat('2026-10-20T16:20:00+00:00'),
                         core.ClassSession.starts_at < datetime.fromisoformat('2026-10-20T17:10:00+00:00'))
              )
              assert booking and booking.source == 'website'
              assert booking.status == 'reserved' and booking.payment_method == 'sumup'
              assert booking.payment_status == 'paid' and booking.amount_cents == 2800
              order = db.scalar(select(core.PaymentOrder).where(
                  core.PaymentOrder.booking_reference == booking.reference,
                  core.PaymentOrder.status == 'paid',
                  core.PaymentOrder.provider == 'sumup',
                  core.PaymentOrder.provider_payment_id.is_not(None)))
              assert order is not None
              class_id = str(booking.klass.mindbody_class_id)
              client_id = str(booking.mindbody_client_id)
              visit_id = str(booking.mindbody_visit_id)
              studio_id, title = booking.klass.studio_id, booking.klass.title
              assert visit_id.isdigit() and class_id.isdigit() and client_id.isdigit()
          client = WriteClient.from_env(timeout=18)
          active_visits = _active_client_visits(client, class_id=class_id, client_id=client_id)
          assert len(active_visits) == 1 and _visit_id(active_visits[0]) == visit_id
          assert not any(_visit_service_identity(active_visits[0])), 'visit already paid or has service'
          location = _resolve_location(client, studio_id, title)
          location_id = int(_value(location, 'Id', 'ID', 'LocationId'))
          payload = {
              'ClientId': int(client_id),
              'LocationId': location_id,
              'InStore': True,
              'SendEmail': False,
              'Test': True,
              'Items': [{
                  'Item': {'Type': 'Service', 'Metadata': {'Id': '100071'}},
                  'Quantity': 1,
                  'VisitIds': [int(visit_id)],
              }],
              'Payments': [{
                  'Type': 'Custom',
                  'Metadata': {'Amount': 28.0, 'Id': 9},
              }],
          }
          assert payload['Test'] is True and payload['Items'][0]['VisitIds'] == [int(visit_id)]
          try:
              response = client._write('sale/checkoutshoppingcart', payload)
              print('test_checkout_success=', isinstance(response, dict), 'test_true_only=', payload['Test'])
          except Exception as exc:
              msg = re.sub(r'[0-9]+', '#', str(exc)[:280])
              print('test_checkout_failed=', type(exc).__name__, msg)
              raise
          PY
          echo 'Checkout Test=true finished; no sale posted.'
          REMOTE
