name: Inspect Mindbody Commerce Live

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-mindbody-commerce-live.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Validate paid visit reconciliation without writing
        env:
          API_KEY: ${{ secrets.MINDBODY_API_KEY }}
          SITE_ID: ${{ secrets.MINDBODY_SITE_ID }}
          STAFF_USERNAME: ${{ secrets.MINDBODY_STAFF_USERNAME }}
          STAFF_PASSWORD: ${{ secrets.MINDBODY_STAFF_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          base="https://api.mindbodyonline.com/public/v6"
          common={"API-Key":os.environ["API_KEY"],"SiteId":os.environ["SITE_ID"],"Accept":"application/json","Content-Type":"application/json"}
          body=json.dumps({"Username":os.environ["STAFF_USERNAME"],"Password":os.environ["STAFF_PASSWORD"]}).encode()
          req=urllib.request.Request(base+"/usertoken/issue",data=body,method="POST",headers=common)
          with urllib.request.urlopen(req,timeout=30) as res:
              tok=json.load(res)
          token=tok.get("AccessToken") or tok.get("Token")
          auth={**common,"Authorization":token}

          def request(method,path,params=None,payload=None):
              q=urllib.parse.urlencode(params or {},doseq=True)
              req=urllib.request.Request(
                  base+path+("?" + q if q else ""),
                  data=(json.dumps(payload).encode() if payload is not None else None),
                  method=method,
                  headers=auth,
              )
              try:
                  with urllib.request.urlopen(req,timeout=30) as res:
                      raw=res.read().decode()
                      return res.status,(json.loads(raw) if raw else {})
              except urllib.error.HTTPError as exc:
                  raw=exc.read().decode(errors="replace")
                  try: parsed=json.loads(raw)
                  except Exception: parsed={"raw":raw[:1200]}
                  return exc.code,parsed

          # Read custom payment methods configured by the business.
          st,custom=request("GET","/sale/custompaymentmethods",{"request.limit":100,"request.offset":0})
          print("CUSTOM_PAYMENT_METHODS",st)
          print(json.dumps(custom,ensure_ascii=False)[:12000])

          # Exact pricing options valid for the Katharina class shown in the report.
          class_id=20866
          location_id=1
          st,services=request("GET","/sale/services",{
              "request.classId":class_id,
              "request.locationId":location_id,
              "request.sellOnline":True,
              "request.includeDiscontinued":False,
              "request.limit":200,
              "request.offset":0,
          })
          rows=services.get("Services") or services.get("services") or []
          print("CLASS_SERVICES",st,len(rows))
          for s in rows:
              print(json.dumps({k:s.get(k) for k in ["Id","Name","Price","OnlinePrice","Count","ProductId","ProgramId","SellOnline","Type"] if k in s},ensure_ascii=False))

          candidates=[]
          for s in rows:
              normalized=" ".join(str(s.get("Name") or "").split()).casefold()
              price=s.get("OnlinePrice")
              if price is None: price=s.get("Price")
              if normalized=="1 class" and int(s.get("Count") or 0)==1 and abs(float(price or 0)-28.0)<0.001:
                  candidates.append(s)
          print("CANDIDATES",json.dumps([{"Id":x.get("Id"),"Name":x.get("Name"),"ProgramId":x.get("ProgramId")} for x in candidates],ensure_ascii=False))

          # Prefer the canonical exact current label when Mindbody has legacy duplicates.
          canonical=[x for x in candidates if str(x.get("Name") or "")=="1 Class"]
          picked=(canonical[0] if len(canonical)==1 else None)
          if not picked:
              raise SystemExit("No unambiguous canonical 1 Class pricing option")
          service_id=picked["Id"]
          print("PICKED_SERVICE",service_id)

          # Test=true is explicitly non-persistent in current Mindbody V6.
          # Validate possible representations of an externally collected SumUp payment.
          variants=[
              ("Other", {"Amount":28.0,"Notes":"External SumUp"}),
              ("Custom", {"Amount":28.0,"Id":9}),
              ("Cash", {"Amount":28.0,"Notes":"External SumUp"}),
          ]
          for payment_type, metadata in variants:
              payload={
                  "ClientId":100019131,
                  "LocationId":location_id,
                  "InStore":True,
                  "SendEmail":False,
                  "Test":True,
                  "Items":[{
                      "Item":{"Type":"Service","Metadata":{"Id":str(service_id)}},
                      "Quantity":1,
                      "ClassIds":[class_id],
                  }],
                  "Payments":[{"Type":payment_type,"Metadata":metadata}],
              }
              code,data=request("POST","/sale/checkoutshoppingcart",payload=payload)
              err=((data.get("Error") or {}).get("Message") if isinstance(data,dict) else None)
              print("PAYMENT_TEST",json.dumps({"type":payment_type,"http":code,"error":err,"has_cart":bool(isinstance(data,dict) and data.get("ShoppingCart"))},ensure_ascii=False))
          PY
