name: Classy Targeted Mindbody Pricing Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/classy-service-catalog-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install SSH
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Check exact class pricing options without sale or bulk sync
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          test -n "$HOST" && test -n "$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/classypilates
          docker compose exec -T api python - <<'PY'
          from sqlalchemy import select
          import main as core
          from mindbody_sync import WriteClient, _resolve_location, _value, _service_price_cents, _pick_single_class_service
          with core.SessionLocal() as db:
              matches = list(db.scalars(select(core.ClassSession).where(
                  core.ClassSession.mindbody_class_id.is_not(None),
                  core.ClassSession.starts_at >= '2026-10-20T16:20:00+00:00',
                  core.ClassSession.starts_at < '2026-10-20T17:10:00+00:00',
              )))
              assert 0 < len(matches) < 20, f'unexpected_target_class_count={len(matches)}'
              target = matches[0]
              local_studio_id, title = target.studio_id, target.title
              class_id = str(target.mindbody_class_id)
          client = WriteClient.from_env(timeout=18.0)
          location = _resolve_location(client, local_studio_id, title)
          location_id = str(_value(location, 'Id', 'ID', 'LocationId', default=''))
          services = client.get_sale_services_for_class(class_id, location_id)
          print('provider_service_count=', len(services), 'class_location_resolved=', bool(location_id))
          print('provider_service_sample=', [
              {
                  'name': str(_value(row, 'Name', 'name', default=''))[:70],
                  'type': str(_value(row, 'Type', 'type', default=''))[:50],
                  'count': _value(row, 'Count', 'count', default=None),
                  'online_price': _value(row, 'OnlinePrice', 'onlinePrice', default=None),
                  'price': _value(row, 'Price', 'price', default=None),
                  'price_cents': _service_price_cents(row),
                  'id': str(_value(row, 'Id', 'ID', default='')),
              }
              for row in services if
              'class' in str(_value(row, 'Name', 'name', default='')).casefold()
              or _service_price_cents(row) == 2800
          ][:25])
          try:
              row = _pick_single_class_service(services, amount_cents=2800)
              print('strict_picker_match=', str(_value(row, 'Id', 'ID', default='')))
          except Exception as exc:
              print('strict_picker_failure=', type(exc).__name__, str(exc)[:140])
          PY
          echo 'Targeted read-only catalog inspection complete.'
          REMOTE
