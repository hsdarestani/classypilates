name: Deploy Classy Production

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "public/**"
      - "docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Upload release
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          test -n "$HOST" && test -n "$PASS"
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 root@"$HOST" 'mkdir -p /opt/classypilates'
          sshpass -e rsync -az --delete \
            --exclude='.git' --exclude='.env' --exclude='__pycache__' \
            -e 'ssh -o StrictHostKeyChecking=no' ./ root@"$HOST":/opt/classypilates/

      - name: Build and start production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          SMTP_PASS: ${{ secrets.CLASSY_SMTP_PASS }}
          MINDBODY_API_KEY: ${{ secrets.MINDBODY_API_KEY }}
          MINDBODY_SITE_ID: ${{ secrets.MINDBODY_SITE_ID }}
          MINDBODY_STAFF_USERNAME: ${{ secrets.MINDBODY_STAFF_USERNAME }}
          MINDBODY_STAFF_PASSWORD: ${{ secrets.MINDBODY_STAFF_PASSWORD }}
          SUMUPAPIKEY: ${{ secrets.SUMUPAPIKEY }}
          SUMUPMERCHANT: ${{ secrets.SUMUPMERCHANT }}
        run: |
          test -n "$SMTP_PASS"
          test -n "$MINDBODY_API_KEY" && test -n "$MINDBODY_SITE_ID"
          test -n "$MINDBODY_STAFF_USERNAME" && test -n "$MINDBODY_STAFF_PASSWORD"
          test -n "$SUMUPAPIKEY" && test -n "$SUMUPMERCHANT"
          export SSHPASS="$PASS"
          SMTP_PASS_B64="$(printf '%s' "$SMTP_PASS" | base64 -w0)"
          MINDBODY_API_KEY_B64="$(printf '%s' "$MINDBODY_API_KEY" | base64 -w0)"
          MINDBODY_SITE_ID_B64="$(printf '%s' "$MINDBODY_SITE_ID" | base64 -w0)"
          MINDBODY_STAFF_USERNAME_B64="$(printf '%s' "$MINDBODY_STAFF_USERNAME" | base64 -w0)"
          MINDBODY_STAFF_PASSWORD_B64="$(printf '%s' "$MINDBODY_STAFF_PASSWORD" | base64 -w0)"
          SUMUPAPIKEY_B64="$(printf '%s' "$SUMUPAPIKEY" | base64 -w0)"
          SUMUPMERCHANT_B64="$(printf '%s' "$SUMUPMERCHANT" | base64 -w0)"
          echo "::add-mask::$SUMUPAPIKEY_B64"
          echo "::add-mask::$SUMUPMERCHANT_B64"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 root@"$HOST" "SMTP_PASS_B64='$SMTP_PASS_B64' MINDBODY_API_KEY_B64='$MINDBODY_API_KEY_B64' MINDBODY_SITE_ID_B64='$MINDBODY_SITE_ID_B64' MINDBODY_STAFF_USERNAME_B64='$MINDBODY_STAFF_USERNAME_B64' MINDBODY_STAFF_PASSWORD_B64='$MINDBODY_STAFF_PASSWORD_B64' SUMUPAPIKEY_B64='$SUMUPAPIKEY_B64' SUMUPMERCHANT_B64='$SUMUPMERCHANT_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/classypilates

          SMTP_PASSWORD="$(printf '%s' "$SMTP_PASS_B64" | base64 -d)"
          MINDBODY_API_KEY_VALUE="$(printf '%s' "$MINDBODY_API_KEY_B64" | base64 -d)"
          MINDBODY_SITE_ID_VALUE="$(printf '%s' "$MINDBODY_SITE_ID_B64" | base64 -d)"
          MINDBODY_STAFF_USERNAME_VALUE="$(printf '%s' "$MINDBODY_STAFF_USERNAME_B64" | base64 -d)"
          MINDBODY_STAFF_PASSWORD_VALUE="$(printf '%s' "$MINDBODY_STAFF_PASSWORD_B64" | base64 -d)"
          SUMUPAPIKEY_VALUE="$(printf '%s' "$SUMUPAPIKEY_B64" | base64 -d)"
          SUMUPMERCHANT_VALUE="$(printf '%s' "$SUMUPMERCHANT_B64" | base64 -d)"
          if [ ! -f .env ]; then
            POSTGRES_PASSWORD="$(openssl rand -hex 24)"
            JWT_SECRET="$(openssl rand -hex 32)"
            {
              printf '%s\n' 'POSTGRES_DB=classy'
              printf '%s\n' 'POSTGRES_USER=classy'
              printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
              printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
              printf '%s\n' 'JWT_TTL_HOURS=24'
            } > .env
            chmod 600 .env
          fi
          sed -i '/^SMTP_HOST=/d;/^SMTP_PORT=/d;/^SMTP_USER=/d;/^SMTP_PASS=/d;/^SMTP_FROM=/d;/^SMTP_SSL=/d;/^SMTP_STARTTLS=/d;/^MINDBODY_API_KEY=/d;/^MINDBODY_SITE_ID=/d;/^MINDBODY_STAFF_USERNAME=/d;/^MINDBODY_STAFF_PASSWORD=/d;/^SUMUPAPIKEY=/d;/^SUMUPMERCHANT=/d' .env
          {
            printf '%s\n' 'SMTP_HOST=host267.alfahosting-server.de'
            printf '%s\n' 'SMTP_PORT=465'
            printf '%s\n' 'SMTP_USER=booking@classypilates.de'
            printf 'SMTP_PASS=%s\n' "$SMTP_PASSWORD"
            printf '%s\n' 'SMTP_FROM=Classy Pilates <booking@classypilates.de>'
            printf '%s\n' 'SMTP_SSL=true'
            printf '%s\n' 'SMTP_STARTTLS=false'
            printf 'MINDBODY_API_KEY=%s\n' "$MINDBODY_API_KEY_VALUE"
            printf 'MINDBODY_SITE_ID=%s\n' "$MINDBODY_SITE_ID_VALUE"
            printf 'MINDBODY_STAFF_USERNAME=%s\n' "$MINDBODY_STAFF_USERNAME_VALUE"
            printf 'MINDBODY_STAFF_PASSWORD=%s\n' "$MINDBODY_STAFF_PASSWORD_VALUE"
            printf 'SUMUPAPIKEY=%s\n' "$SUMUPAPIKEY_VALUE"
            printf 'SUMUPMERCHANT=%s\n' "$SUMUPMERCHANT_VALUE"
          } >> .env
          chmod 600 .env
          unset SMTP_PASSWORD SMTP_PASS_B64 MINDBODY_API_KEY_VALUE MINDBODY_SITE_ID_VALUE
          unset MINDBODY_STAFF_USERNAME_VALUE MINDBODY_STAFF_PASSWORD_VALUE
          unset SUMUPAPIKEY_VALUE SUMUPMERCHANT_VALUE SUMUPAPIKEY_B64 SUMUPMERCHANT_B64
          unset MINDBODY_API_KEY_B64 MINDBODY_SITE_ID_B64 MINDBODY_STAFF_USERNAME_B64 MINDBODY_STAFF_PASSWORD_B64

          if ! command -v docker >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y ca-certificates curl
              curl -fsSL https://get.docker.com | sh
            else
              echo "Docker is required but no supported package manager was found."
              exit 1
            fi
          fi

          if ! docker compose version >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y docker-compose-plugin
            else
              echo "Docker Compose plugin is required."
              exit 1
            fi
          fi

          docker compose up -d --build --remove-orphans

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/api/health
          curl -fsS http://127.0.0.1:8787/api/checkout/create | grep -q '"provider":"sumup"'

          # Do not issue a second Mindbody staff token from a separate deploy
          # process after the API has started. Mindbody can invalidate the token
          # cached by the running API when another token is issued for the same
          # staff credentials.
          docker compose exec -T api python - <<'PY'
          from mindbody_sync import capability_status
          status = capability_status()
          if not status.get("configured"):
              raise SystemExit("Mindbody credentials are not configured")
          print("Mindbody configuration present: OK")
          PY

          # Production schedule is now sourced from live Mindbody. Do not import the
          # historical bundled snapshot here; it can recreate classes that were later
          # changed or removed in Mindbody.
          curl -fsS http://127.0.0.1:8787/api/health
          curl -fsS --max-time 5 -o /tmp/classy-schedule-smoke.json 'http://127.0.0.1:8787/api/schedule'
          grep -q '"classes":\[' /tmp/classy-schedule-smoke.json
          rm -f /tmp/classy-schedule-smoke.json

          EMAIL_ONLY_CODE=$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8787/api/bookings?email=privacy-check@example.com')
          test "$EMAIL_ONLY_CODE" = "422"
          UNKNOWN_LOOKUP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8787/api/bookings?email=privacy-check@example.com&reference=CP-00000000')
          test "$UNKNOWN_LOOKUP_CODE" = "404"

          SMOKE_EMAIL="smoke-$(openssl rand -hex 6)@classypilates.de"
          SMOKE_PASSWORD="Smoke-$(openssl rand -hex 10)!"
          SMOKE_CUSTOMER_EMAIL="customer-smoke-$(openssl rand -hex 6)@classypilates.de"
          SMOKE_CUSTOMER_PASSWORD="Member-$(openssl rand -hex 10)!"
          export SMOKE_EMAIL SMOKE_PASSWORD SMOKE_CUSTOMER_EMAIL SMOKE_CUSTOMER_PASSWORD
          docker compose exec -T -e SMOKE_EMAIL -e SMOKE_PASSWORD api python - <<'PY'
          import os
          from sqlalchemy import select
          from main import SessionLocal, User, Role, pwd
          with SessionLocal() as db:
              role = db.scalar(select(Role).where(Role.name == "Administrator"))
              db.add(User(email=os.environ["SMOKE_EMAIL"], password_hash=pwd.hash(os.environ["SMOKE_PASSWORD"]), first_name="Smoke", roles=[role]))
              db.commit()
          PY
          cleanup_smoke() {
            docker compose exec -T -e SMOKE_EMAIL -e SMOKE_CUSTOMER_EMAIL api python - <<'PY'
          import os
          from sqlalchemy import delete
          from main import SessionLocal, User
          with SessionLocal() as db:
              db.execute(delete(User).where(User.email.in_([os.environ["SMOKE_EMAIL"], os.environ["SMOKE_CUSTOMER_EMAIL"]])))
              db.commit()
          PY
            rm -f /tmp/classy-smoke-cookies /tmp/classy-smoke-login.json /tmp/classy-customer-cookies /tmp/classy-customer-register.json
          }
          trap cleanup_smoke EXIT
          LOGIN_CODE=$(curl -sS -o /tmp/classy-smoke-login.json -c /tmp/classy-smoke-cookies -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$SMOKE_EMAIL\",\"password\":\"$SMOKE_PASSWORD\"}" \
            http://127.0.0.1:8787/api/auth/login)
          test "$LOGIN_CODE" = "200"
          SMOKE_TOKEN=$(python3 -c 'import json; print(json.load(open("/tmp/classy-smoke-login.json"))["token"])')
          curl -fsS -H "Authorization: Bearer $SMOKE_TOKEN" http://127.0.0.1:8787/api/auth/me >/dev/null
          curl -fsS -H "Authorization: Bearer $SMOKE_TOKEN" http://127.0.0.1:8787/api/staff/dashboard >/dev/null

          # Read-only integration checks for the unified customer directory and
          # Mindbody-backed class editor. Never create a provider class in deploy.
          CUSTOMERS_CODE=$(curl -sS -o /tmp/classy-customers-smoke.json -w '%{http_code}'             -H "Authorization: Bearer $SMOKE_TOKEN"             http://127.0.0.1:8787/api/staff/customers)
          echo "Unified customer smoke HTTP $CUSTOMERS_CODE"
          test "$CUSTOMERS_CODE" = "200"
          grep -q '"customers":\[' /tmp/classy-customers-smoke.json

          CATALOG_CODE=$(curl -sS -o /tmp/classy-mindbody-catalog.json -w '%{http_code}'             -H "Authorization: Bearer $SMOKE_TOKEN"             http://127.0.0.1:8787/api/staff/mindbody/catalog)
          echo "Mindbody catalog smoke HTTP $CATALOG_CODE"
          test "$CATALOG_CODE" = "200"
          grep -q '"class_descriptions":\[' /tmp/classy-mindbody-catalog.json
          grep -q '"locations":\[' /tmp/classy-mindbody-catalog.json
          rm -f /tmp/classy-customers-smoke.json /tmp/classy-mindbody-catalog.json

          CUSTOMER_CODE=$(curl -sS -o /tmp/classy-customer-register.json -c /tmp/classy-customer-cookies -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$SMOKE_CUSTOMER_EMAIL\",\"password\":\"$SMOKE_CUSTOMER_PASSWORD\",\"first_name\":\"Portal\",\"last_name\":\"Smoke\"}" \
            http://127.0.0.1:8787/api/auth/register)
          test "$CUSTOMER_CODE" = "200"
          CUSTOMER_TOKEN=$(python3 -c 'import json; data=json.load(open("/tmp/classy-customer-register.json")); assert data["user"]["portal"] == "/account"; print(data["token"])')
          curl -fsS -H "Authorization: Bearer $CUSTOMER_TOKEN" http://127.0.0.1:8787/api/customer/dashboard >/dev/null
          CUSTOMER_STAFF_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CUSTOMER_TOKEN" http://127.0.0.1:8787/api/staff/dashboard)
          test "$CUSTOMER_STAFF_CODE" = "403"
          cleanup_smoke
          trap - EXIT

          configure_nginx() {
            mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled /etc/nginx/snippets
            cat > /etc/nginx/snippets/classy-routes.conf <<'NGINX_ROUTES'
              root /opt/classypilates/public;
              index index.html;

              add_header X-Content-Type-Options "nosniff" always;
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

              location ~ /\.(?!well-known/) {
                  deny all;
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:8787;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  client_max_body_size 12m;
              }

              # Temporary compatibility bridge for media that still lives on the
              # legacy WordPress host after the apex-domain cutover.
              location ^~ /wp-content/ {
                  proxy_pass https://81.88.34.82;
                  proxy_http_version 1.1;
                  proxy_set_header Host classypilates.de;
                  proxy_ssl_server_name on;
                  proxy_ssl_name classypilates.de;
                  proxy_ssl_verify off;
                  proxy_set_header Connection "";
                  proxy_buffering on;
                  proxy_cache_valid 200 1h;
              }

              location = /admin { try_files /staff.html =404; add_header Cache-Control "no-store"; }
              location = /coach { try_files /staff.html =404; add_header Cache-Control "no-store"; }
              location = /staff { try_files /staff.html =404; add_header Cache-Control "no-store"; }
              location = /admin.html { return 301 /admin; }
              location = /coach.html { return 301 /coach; }
              location = /staff.html { return 301 /staff; }
              location = /staff.js { try_files /staff.js =404; add_header Cache-Control "no-cache, no-store, must-revalidate"; }
              location = /staff.css { try_files /staff.css =404; add_header Cache-Control "no-cache, no-store, must-revalidate"; }

              location = /imprint { try_files /imprint.html =404; }
              location = /data-privacy { try_files /data-privacy.html =404; }
              location = /terms-conditions { try_files /terms-conditions.html =404; }
              location = /studio-rules { try_files /studio-rules.html =404; }
              location = /shop { try_files /shop.html =404; }
              location = /classfit { try_files /classfit.html =404; }
              location = /login { try_files /login.html =404; add_header Cache-Control "no-store"; }
              location = /account { try_files /account.html =404; add_header Cache-Control "no-store"; }
              location = /imprint.html { return 301 /imprint; }
              location = /data-privacy.html { return 301 /data-privacy; }
              location = /terms-conditions.html { return 301 /terms-conditions; }
              location = /studio-rules.html { return 301 /studio-rules; }
              location = /shop.html { return 301 /shop; }
              location = /classfit.html { return 301 /classfit; }
              location = /login.html { return 301 /login; }
              location = /account.html { return 301 /account; }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          NGINX_ROUTES

            if [ -f /etc/letsencrypt/live/new.classypilates.de/fullchain.pem ] && [ -f /etc/letsencrypt/live/new.classypilates.de/privkey.pem ]; then
              cat > /etc/nginx/sites-available/new.classypilates.de <<'NGINX_TLS'
          server {
              listen 80;
              listen [::]:80;
              server_name new.classypilates.de;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl http2;
              listen [::]:443 ssl http2;
              server_name new.classypilates.de;
              ssl_certificate /etc/letsencrypt/live/new.classypilates.de/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/new.classypilates.de/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              include /etc/nginx/snippets/classy-routes.conf;
          }
          NGINX_TLS
            else
              cat > /etc/nginx/sites-available/new.classypilates.de <<'NGINX_HTTP'
          server {
              listen 80;
              listen [::]:80;
              server_name new.classypilates.de;
              include /etc/nginx/snippets/classy-routes.conf;
          }
          NGINX_HTTP
            fi
            cat >> /etc/nginx/sites-available/new.classypilates.de <<'NGINX_APEX_PREVIEW'
          # Prepared in advance for the future apex-domain cutover.
          server {
              listen 80;
              listen [::]:80;
              server_name classypilates.de www.classypilates.de;
              include /etc/nginx/snippets/classy-routes.conf;
          }
          NGINX_APEX_PREVIEW
            rm -f /etc/nginx/sites-enabled/classy.smarbiz.sbs
            ln -sfn /etc/nginx/sites-available/new.classypilates.de /etc/nginx/sites-enabled/new.classypilates.de
            nginx -t
            systemctl reload nginx || nginx -s reload
          }

          if command -v nginx >/dev/null 2>&1; then
            configure_nginx
          elif command -v caddy >/dev/null 2>&1 && [ -f /etc/caddy/Caddyfile ]; then
            if ! grep -q 'new.classypilates.de' /etc/caddy/Caddyfile; then
              cat >> /etc/caddy/Caddyfile <<'CADDY'

          new.classypilates.de {
              encode zstd gzip
              root * /opt/classypilates/public
              handle /api/* {
                  reverse_proxy 127.0.0.1:8787
              }
              try_files {path} /index.html
              file_server
          }
          CADDY
            fi
            caddy validate --config /etc/caddy/Caddyfile
            systemctl reload caddy
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y nginx
            configure_nginx
          else
            echo "API is running on 127.0.0.1:8787 but no supported reverse proxy was found."
            exit 1
          fi

          if command -v certbot >/dev/null 2>&1 && command -v nginx >/dev/null 2>&1; then
            if [ ! -f /etc/letsencrypt/live/new.classypilates.de/fullchain.pem ] || [ ! -f /etc/letsencrypt/live/new.classypilates.de/privkey.pem ]; then
              certbot --nginx -d new.classypilates.de --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
              configure_nginx
            fi
          fi

          if command -v nginx >/dev/null 2>&1; then
            if [ -f /etc/letsencrypt/live/new.classypilates.de/fullchain.pem ]; then
              VERIFY_URL="https://new.classypilates.de"
              VERIFY_RESOLVE=(--resolve new.classypilates.de:443:127.0.0.1)
            else
              VERIFY_URL="http://127.0.0.1"
              VERIFY_RESOLVE=(-H "Host: new.classypilates.de")
            fi
            curl -kfsS "${VERIFY_RESOLVE[@]}" "$VERIFY_URL/login" | grep -q 'ONE LOGIN'
            curl -kfsS "${VERIFY_RESOLVE[@]}" "$VERIFY_URL/account" | grep -q 'MY CLASSY'
            LOGIN_HTML_CODE=$(curl -ksS -o /dev/null -w '%{http_code}' "${VERIFY_RESOLVE[@]}" "$VERIFY_URL/login.html")
            ACCOUNT_HTML_CODE=$(curl -ksS -o /dev/null -w '%{http_code}' "${VERIFY_RESOLVE[@]}" "$VERIFY_URL/account.html")
            test "$LOGIN_HTML_CODE" = "301"
            test "$ACCOUNT_HTML_CODE" = "301"
          fi

          # Configure Mindbody event delivery only after the HTTPS endpoint is
          # reachable. The subscription is created in PendingActivation, its
          # one-time signature key is persisted to .env, the API is restarted with
          # that key, and only then is the subscription activated.
          WEBHOOK_URL='https://new.classypilates.de/api/integrations/mindbody/webhook'
          if WEBHOOK_PREPARE="$(docker compose exec -T api python mindbody_webhooks.py prepare --webhook-url "$WEBHOOK_URL" 2>/tmp/classy-webhook-prepare.err)"; then
            WEBHOOK_KEY="$(printf '%s' "$WEBHOOK_PREPARE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("signature_key",""))')"
            WEBHOOK_SUBSCRIPTION_ID="$(printf '%s' "$WEBHOOK_PREPARE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("subscription_id",""))')"
            test -n "$WEBHOOK_SUBSCRIPTION_ID"

            if [ -n "$WEBHOOK_KEY" ]; then
              sed -i '/^MINDBODY_WEBHOOK_SIGNATURE_KEY=/d;/^MINDBODY_WEBHOOK_SUBSCRIPTION_ID=/d' .env
              {
                printf 'MINDBODY_WEBHOOK_SIGNATURE_KEY=%s\n' "$WEBHOOK_KEY"
                printf 'MINDBODY_WEBHOOK_SUBSCRIPTION_ID=%s\n' "$WEBHOOK_SUBSCRIPTION_ID"
              } >> .env
              chmod 600 .env
              unset WEBHOOK_KEY WEBHOOK_PREPARE
              docker compose up -d --force-recreate api
              for i in $(seq 1 30); do
                if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then break; fi
                sleep 2
              done
              curl -fsS http://127.0.0.1:8787/api/health >/dev/null
              curl -fsS http://127.0.0.1:8787/api/capabilities | grep -q '"mindbody_webhook"'
            elif ! grep -q '^MINDBODY_WEBHOOK_SUBSCRIPTION_ID=' .env; then
              printf 'MINDBODY_WEBHOOK_SUBSCRIPTION_ID=%s\n' "$WEBHOOK_SUBSCRIPTION_ID" >> .env
              chmod 600 .env
            fi

            if docker compose exec -T api python mindbody_webhooks.py activate --webhook-url "$WEBHOOK_URL" --subscription-id "$WEBHOOK_SUBSCRIPTION_ID" >/tmp/classy-webhook-activate.json 2>/tmp/classy-webhook-activate.err; then
              grep -q '"status":"Active"' /tmp/classy-webhook-activate.json
              echo 'Mindbody webhook subscription: Active'
            else
              echo 'WARNING: Mindbody webhook activation unavailable; 3-minute polling fallback remains active.' >&2
              cat /tmp/classy-webhook-activate.err >&2 || true
            fi
          else
            echo 'WARNING: Mindbody webhook provisioning unavailable; 3-minute polling fallback remains active.' >&2
            cat /tmp/classy-webhook-prepare.err >&2 || true
          fi
          rm -f /tmp/classy-webhook-prepare.err /tmp/classy-webhook-activate.err /tmp/classy-webhook-activate.json

          docker compose ps
          REMOTE

      - name: Verify public endpoint
        id: public_verify
        run: |
          sleep 5
          curl -fsSIL --max-time 20 https://new.classypilates.de/ >/dev/null
          curl -fsSL --max-time 20 https://new.classypilates.de/api/health | grep -q '"ok":true'
          curl -fsSL --max-time 20 https://new.classypilates.de/api/checkout/create | grep -q '"provider":"sumup"'

      - name: Verify production sync integrity
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/classypilates

          INTEGRITY="$(docker compose exec -T db sh -lc 'psql -At -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          SELECT 'duplicate_active_website_bookings|' || count(*) FROM (
            SELECT class_id, lower(email)
            FROM bookings
            WHERE source='website' AND status='reserved'
            GROUP BY class_id, lower(email)
            HAVING count(*) > 1
          ) x;

          SELECT 'duplicate_active_spots|' || count(*) FROM (
            SELECT class_id, spot_number
            FROM bookings
            WHERE status='reserved' AND spot_number IS NOT NULL
            GROUP BY class_id, spot_number
            HAVING count(*) > 1
          ) x;

          SELECT 'duplicate_mindbody_visit_ids|' || count(*) FROM (
            SELECT mindbody_visit_id
            FROM bookings
            WHERE mindbody_visit_id IS NOT NULL AND mindbody_visit_id <> ''
            GROUP BY mindbody_visit_id
            HAVING count(*) > 1
          ) x;

          SELECT 'duplicate_waitlist_entries|' || count(*) FROM (
            SELECT class_id, lower(email)
            FROM waitlist
            GROUP BY class_id, lower(email)
            HAVING count(*) > 1
          ) x;

          SELECT 'duplicate_mindbody_waitlist_ids|' || count(*) FROM (
            SELECT mindbody_waitlist_entry_id
            FROM waitlist
            WHERE mindbody_waitlist_entry_id IS NOT NULL AND mindbody_waitlist_entry_id <> ''
            GROUP BY mindbody_waitlist_entry_id
            HAVING count(*) > 1
          ) x;

          SELECT 'multiple_active_payment_attempts|' || count(*) FROM (
            SELECT booking_reference
            FROM payment_orders
            WHERE booking_reference IS NOT NULL AND status IN ('pending','paid')
            GROUP BY booking_reference
            HAVING count(*) > 1
          ) x;

          SELECT 'stale_unsynced_website_bookings|' || count(*)
          FROM bookings b
          JOIN classes c ON c.id=b.class_id
          WHERE b.source='website'
            AND b.status='reserved'
            AND b.payment_status IN ('paid','pending')
            AND c.mindbody_class_id IS NOT NULL
            AND b.mindbody_sync_status <> 'synced'
            AND b.created_at < now() - interval '5 minutes';

          SELECT 'stale_failed_mindbody_cancellations|' || count(*)
          FROM bookings
          WHERE mindbody_sync_status='cancel_failed'
            AND created_at < now() - interval '5 minutes';

          SELECT 'unsynced_mindbody_waitlist_rows|' || count(*)
          FROM waitlist w
          JOIN classes c ON c.id=w.class_id
          WHERE c.mindbody_class_id IS NOT NULL
            AND (w.mindbody_waitlist_entry_id IS NULL OR w.mindbody_sync_status <> 'synced');

          SELECT 'active_future_local_only_classes|' || count(*)
          FROM classes
          WHERE status='active'
            AND starts_at >= now()
            AND starts_at < now() + interval '45 days'
            AND mindbody_class_id IS NULL;

          SELECT 'duplicate_mindbody_coach_mappings|' || count(*) FROM (
            SELECT remote_id
            FROM mindbody_sync_state
            WHERE entity_type='coach' AND remote_id IS NOT NULL AND remote_id <> ''
            GROUP BY remote_id
            HAVING count(*) > 1
          ) x;

          SELECT 'legacy_local_coach_alias_groups|' || count(*) FROM (
            SELECT
              lower(
                CASE
                  WHEN trim(display_name) ~* '^coach[[:space:]]+' THEN regexp_replace(trim(display_name), '^coach[[:space:]]+', '', 'i')
                  WHEN array_length(regexp_split_to_array(trim(display_name), '[[:space:]]+'),1)=2
                       AND lower(split_part(trim(display_name),' ',1))=lower(split_part(trim(display_name),' ',2))
                    THEN split_part(trim(display_name),' ',1)
                  ELSE regexp_replace(trim(display_name), '[[:space:]]+', ' ', 'g')
                END
              ) AS canon
            FROM coaches
            WHERE active=true AND trim(display_name)<>''
            GROUP BY 1
            HAVING count(*) > 1
               AND bool_or(
                 trim(display_name) ~* '^coach[[:space:]]+'
                 OR (
                   array_length(regexp_split_to_array(trim(display_name), '[[:space:]]+'),1)=2
                   AND lower(split_part(trim(display_name),' ',1))=lower(split_part(trim(display_name),' ',2))
                 )
               )
          ) x;
          SQL
          )"

          printf '%s\n' "$INTEGRITY"
          BAD="$(printf '%s\n' "$INTEGRITY" | awk -F'|' 'NF==2 && ($2+0)!=0 {print}')"
          if [ -n "$BAD" ]; then
            echo "Production sync integrity violations:"
            printf '%s\n' "$BAD"
            exit 3
          fi
          echo "Production sync integrity: OK"

          echo "Recent failed website Mindbody holds (diagnostic, no customer data):"
          docker compose exec -T db sh -lc 'psql -At -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          SELECT
            b.reference || '|' ||
            c.id || '|' ||
            regexp_replace(coalesce(b.mindbody_sync_error,''), E'[\\n\\r]+', ' ', 'g')
          FROM bookings b
          JOIN classes c ON c.id=b.class_id
          WHERE b.source='website'
            AND b.payment_status='failed'
            AND coalesce(b.mindbody_sync_error,'') <> ''
            AND b.created_at > now() - interval '24 hours'
          ORDER BY b.created_at DESC
          LIMIT 8;
          SQL

          echo "Refreshing Mindbody mirror before final audit..."
          docker compose exec -T api python - <<'PY'
          import mindbody_sync
          print(mindbody_sync.sync_from_mindbody())
          PY

          echo "Running live Mindbody/Classy availability audit..."
          set +e
          docker compose exec -T api python mindbody_audit.py
          AUDIT_STATUS=$?
          set -e

          # Deployment diagnostics run in separate Python processes and can issue
          # another Mindbody staff token. Restart the live API after diagnostics so
          # its in-memory token cache cannot remain invalidated by those checks.
          echo "Restarting API after Mindbody diagnostics..."
          docker compose restart api >/dev/null
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/api/health
          exit "$AUDIT_STATUS"

          REMOTE
