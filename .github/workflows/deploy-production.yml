name: Deploy Classy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Upload release
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          test -n "$HOST" && test -n "$PASS"
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'mkdir -p /opt/classypilates'
          sshpass -e rsync -az --delete \
            --exclude='.git' --exclude='.env' --exclude='__pycache__' \
            -e 'ssh -o StrictHostKeyChecking=no' ./ root@"$HOST":/opt/classypilates/

      - name: Build and start production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/classypilates

          if ! command -v docker >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y ca-certificates curl
              curl -fsSL https://get.docker.com | sh
            else
              echo "Docker is required but no supported package manager was found."
              exit 1
            fi
          fi

          if ! docker compose version >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y docker-compose-plugin
            else
              echo "Docker Compose plugin is required."
              exit 1
            fi
          fi

          if [ ! -f .env ]; then
            POSTGRES_PASSWORD="$(openssl rand -hex 24)"
            JWT_SECRET="$(openssl rand -hex 32)"
            cat > .env <<EOF
          POSTGRES_DB=classy
          POSTGRES_USER=classy
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          JWT_TTL_HOURS=24
          EOF
            chmod 600 .env
          fi

          docker compose up -d --build --remove-orphans

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/api/health

          SMOKE_EMAIL="smoke-$(openssl rand -hex 6)@classy.local"
          SMOKE_PASSWORD="Smoke-$(openssl rand -hex 10)!"
          docker compose exec -T -e SMOKE_EMAIL -e SMOKE_PASSWORD api python - <<'PY'
          import os
          from sqlalchemy import select
          from main import SessionLocal, User, Role, pwd
          with SessionLocal() as db:
              role = db.scalar(select(Role).where(Role.name == "Administrator"))
              db.add(User(email=os.environ["SMOKE_EMAIL"], password_hash=pwd.hash(os.environ["SMOKE_PASSWORD"]), first_name="Smoke", roles=[role]))
              db.commit()
          PY
          cleanup_smoke() {
            docker compose exec -T -e SMOKE_EMAIL api python - <<'PY'
          import os
          from sqlalchemy import delete
          from main import SessionLocal, User
          with SessionLocal() as db:
              db.execute(delete(User).where(User.email == os.environ["SMOKE_EMAIL"]))
              db.commit()
          PY
            rm -f /tmp/classy-smoke-cookies /tmp/classy-smoke-login.json
          }
          trap cleanup_smoke EXIT
          LOGIN_CODE=$(curl -sS -o /tmp/classy-smoke-login.json -c /tmp/classy-smoke-cookies -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$SMOKE_EMAIL\",\"password\":\"$SMOKE_PASSWORD\"}" \
            http://127.0.0.1:8787/api/auth/login)
          test "$LOGIN_CODE" = "200"
          SMOKE_TOKEN=$(docker compose exec -T api python -c 'import json,sys; print(json.load(sys.stdin)["token"])' < /tmp/classy-smoke-login.json)
          curl -fsS -H "Authorization: Bearer $SMOKE_TOKEN" http://127.0.0.1:8787/api/auth/me >/dev/null
          curl -fsS -H "Authorization: Bearer $SMOKE_TOKEN" http://127.0.0.1:8787/api/staff/dashboard >/dev/null
          cleanup_smoke
          trap - EXIT

          configure_nginx() {
            mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            cat > /etc/nginx/sites-available/classy.smarbiz.sbs <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name classy.smarbiz.sbs;
              root /opt/classypilates/public;
              index index.html;

              location /api/ {
                  proxy_pass http://127.0.0.1:8787;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  client_max_body_size 12m;
              }

              location = /admin { try_files /staff.html =404; add_header Cache-Control "no-store"; }
              location = /coach { try_files /staff.html =404; add_header Cache-Control "no-store"; }
              location = /staff { try_files /staff.html =404; add_header Cache-Control "no-store"; }
              location = /admin.html { return 301 /admin; }
              location = /coach.html { return 301 /coach; }
              location = /staff.html { return 301 /staff; }
              location = /staff.js { try_files /staff.js =404; add_header Cache-Control "no-cache, no-store, must-revalidate"; }
              location = /staff.css { try_files /staff.css =404; add_header Cache-Control "no-cache, no-store, must-revalidate"; }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINX
            ln -sfn /etc/nginx/sites-available/classy.smarbiz.sbs /etc/nginx/sites-enabled/classy.smarbiz.sbs
            nginx -t
            systemctl reload nginx || nginx -s reload
          }

          if command -v nginx >/dev/null 2>&1; then
            configure_nginx
          elif command -v caddy >/dev/null 2>&1 && [ -f /etc/caddy/Caddyfile ]; then
            if ! grep -q 'classy.smarbiz.sbs' /etc/caddy/Caddyfile; then
              cat >> /etc/caddy/Caddyfile <<'CADDY'

          classy.smarbiz.sbs {
              encode zstd gzip
              root * /opt/classypilates/public
              handle /api/* {
                  reverse_proxy 127.0.0.1:8787
              }
              try_files {path} /index.html
              file_server
          }
          CADDY
            fi
            caddy validate --config /etc/caddy/Caddyfile
            systemctl reload caddy
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y nginx
            configure_nginx
          else
            echo "API is running on 127.0.0.1:8787 but no supported reverse proxy was found."
            exit 1
          fi

          if command -v certbot >/dev/null 2>&1 && command -v nginx >/dev/null 2>&1; then
            certbot --nginx -d classy.smarbiz.sbs --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
          fi

          docker compose ps
          REMOTE

      - name: Verify public endpoint
        id: public_verify
        continue-on-error: true
        run: |
          sleep 5
          curl -I --max-time 20 https://classy.smarbiz.sbs/ || curl -I --max-time 20 http://classy.smarbiz.sbs/
          curl -fsS --max-time 20 https://classy.smarbiz.sbs/api/health || curl -fsS --max-time 20 http://classy.smarbiz.sbs/api/health

      - name: Publish deployment heartbeat
        if: always()
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          REMOTE_STATUS="unavailable"
          API_STATUS="unavailable"
          if command -v sshpass >/dev/null 2>&1 && [ -n "$HOST" ] && [ -n "$PASS" ]; then
            export SSHPASS="$PASS"
            REMOTE_STATUS=$(sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 root@"$HOST" "cd /opt/classypilates 2>/dev/null && docker compose ps 2>&1 | head -n 20" || true)
            API_STATUS=$(sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 root@"$HOST" "curl -fsS --max-time 5 http://127.0.0.1:8787/api/health 2>&1" || true)
          fi
          cat > DEPLOYMENT_STATUS.md <<EOF
          # Classy Production Deployment Status

          - Workflow status: **${JOB_STATUS}**
          - Commit: \`${COMMIT_SHA}\`
          - Checked at: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          - Local API health: \`${API_STATUS//$'\n'/ }\`

          ## Remote containers
          \`\`\`
          ${REMOTE_STATUS}
          \`\`\`
          EOF
          git config user.name "classy-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add DEPLOYMENT_STATUS.md
          git commit -m "chore: update deployment status [skip ci]" || exit 0
          git push origin HEAD:main
