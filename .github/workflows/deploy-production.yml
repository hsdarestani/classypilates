name: Deploy Classy Production

on:
  push:
    branches: [main]
    paths-ignore:
      - DEPLOYMENT_STATUS.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Upload release
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          test -n "$HOST" && test -n "$PASS"
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'mkdir -p /opt/classypilates'
          sshpass -e rsync -az --delete \
            --exclude='.git' --exclude='.env' --exclude='__pycache__' \
            -e 'ssh -o StrictHostKeyChecking=no' ./ root@"$HOST":/opt/classypilates/

      - name: Build and start production
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/classypilates

          if ! command -v docker >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y ca-certificates curl
              curl -fsSL https://get.docker.com | sh
            else
              echo "Docker is required but no supported package manager was found."
              exit 1
            fi
          fi

          if ! docker compose version >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y docker-compose-plugin
            else
              echo "Docker Compose plugin is required."
              exit 1
            fi
          fi

          if [ ! -f .env ]; then
            POSTGRES_PASSWORD="$(openssl rand -hex 24)"
            JWT_SECRET="$(openssl rand -hex 32)"
            cat > .env <<EOF
          POSTGRES_DB=classy
          POSTGRES_USER=classy
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          JWT_TTL_HOURS=24
          EOF
            chmod 600 .env
          fi

          docker compose up -d --build --remove-orphans

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/api/health

          # The importer uses SQLAlchemy Core only, so it can safely run beside
          # the API without loading the full application a second time.
          docker compose exec -T api python import_mindbody_schedule.py \
            --source /app/data/mindbody_schedule_2026-04-01_to_2026-08-24.json.gz </dev/null
          curl -fsS http://127.0.0.1:8787/api/health

          EMAIL_ONLY_CODE=$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8787/api/bookings?email=privacy-check@example.com')
          test "$EMAIL_ONLY_CODE" = "422"
          UNKNOWN_LOOKUP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8787/api/bookings?email=privacy-check@example.com&reference=CP-00000000')
          test "$UNKNOWN_LOOKUP_CODE" = "404"

          SMOKE_EMAIL="smoke-$(openssl rand -hex 6)@classypilates.de"
          SMOKE_PASSWORD="Smoke-$(openssl rand -hex 10)!"
          SMOKE_CUSTOMER_EMAIL="customer-smoke-$(openssl rand -hex 6)@classypilates.de"
          SMOKE_CUSTOMER_PASSWORD="Member-$(openssl rand -hex 10)!"
          export SMOKE_EMAIL SMOKE_PASSWORD SMOKE_CUSTOMER_EMAIL SMOKE_CUSTOMER_PASSWORD
          docker compose exec -T -e SMOKE_EMAIL -e SMOKE_PASSWORD api python - <<'PY'
          import os
          from sqlalchemy import select
          from main import SessionLocal, User, Role, pwd
          with SessionLocal() as db:
              role = db.scalar(select(Role).where(Role.name == "Administrator"))
              db.add(User(email=os.environ["SMOKE_EMAIL"], password_hash=pwd.hash(os.environ["SMOKE_PASSWORD"]), first_name="Smoke", roles=[role]))
              db.commit()
          PY
          cleanup_smoke() {
            docker compose exec -T -e SMOKE_EMAIL -e SMOKE_CUSTOMER_EMAIL api python - <<'PY'
          import os
          from sqlalchemy import delete
          from main import SessionLocal, User
          with SessionLocal() as db:
              db.execute(delete(User).where(User.email.in_([os.environ["SMOKE_EMAIL"], os.environ["SMOKE_CUSTOMER_EMAIL"]])))
              db.commit()
          PY
            rm -f /tmp/classy-smoke-cookies /tmp/classy-smoke-login.json /tmp/classy-customer-cookies /tmp/classy-customer-register.json
          }
          trap cleanup_smoke EXIT
          LOGIN_CODE=$(curl -sS -o /tmp/classy-smoke-login.json -c /tmp/classy-smoke-cookies -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$SMOKE_EMAIL\",\"password\":\"$SMOKE_PASSWORD\"}" \
            http://127.0.0.1:8787/api/auth/login)
          test "$LOGIN_CODE" = "200"
          SMOKE_TOKEN=$(python3 -c 'import json; print(json.load(open("/tmp/classy-smoke-login.json"))["token"])')
          curl -fsS -H "Authorization: Bearer $SMOKE_TOKEN" http://127.0.0.1:8787/api/auth/me >/dev/null
          curl -fsS -H "Authorization: Bearer $SMOKE_TOKEN" http://127.0.0.1:8787/api/staff/dashboard >/dev/null

          CUSTOMER_CODE=$(curl -sS -o /tmp/classy-customer-register.json -c /tmp/classy-customer-cookies -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$SMOKE_CUSTOMER_EMAIL\",\"password\":\"$SMOKE_CUSTOMER_PASSWORD\",\"first_name\":\"Portal\",\"last_name\":\"Smoke\"}" \
            http://127.0.0.1:8787/api/auth/register)
          test "$CUSTOMER_CODE" = "200"
          CUSTOMER_TOKEN=$(python3 -c 'import json; data=json.load(open("/tmp/classy-customer-register.json")); assert data["user"]["portal"] == "/account"; print(data["token"])')
          curl -fsS -H "Authorization: Bearer $CUSTOMER_TOKEN" http://127.0.0.1:8787/api/customer/dashboard >/dev/null
          CUSTOMER_STAFF_CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CUSTOMER_TOKEN" http://127.0.0.1:8787/api/staff/dashboard)
          test "$CUSTOMER_STAFF_CODE" = "403"
          cleanup_smoke
          trap - EXIT

          configure_nginx() {
            mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled /etc/nginx/snippets
            cat > /etc/nginx/snippets/classy-routes.conf <<'NGINX_ROUTES'
              root /opt/classypilates/public;
              index index.html;

              location /api/ {
                  proxy_pass http://127.0.0.1:8787;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  client_max_body_size 12m;
              }

              location = /admin { try_files /staff.html =404; add_header Cache-Control "no-store"; }
              location = /coach { try_files /staff.html =404; add_header Cache-Control "no-store"; }
              location = /staff { try_files /staff.html =404; add_header Cache-Control "no-store"; }
              location = /admin.html { return 301 /admin; }
              location = /coach.html { return 301 /coach; }
              location = /staff.html { return 301 /staff; }
              location = /staff.js { try_files /staff.js =404; add_header Cache-Control "no-cache, no-store, must-revalidate"; }
              location = /staff.css { try_files /staff.css =404; add_header Cache-Control "no-cache, no-store, must-revalidate"; }

              location = /imprint { try_files /imprint.html =404; }
              location = /data-privacy { try_files /data-privacy.html =404; }
              location = /terms-conditions { try_files /terms-conditions.html =404; }
              location = /studio-rules { try_files /studio-rules.html =404; }
              location = /shop { try_files /shop.html =404; }
              location = /classfit { try_files /classfit.html =404; }
              location = /login { try_files /login.html =404; add_header Cache-Control "no-store"; }
              location = /account { try_files /account.html =404; add_header Cache-Control "no-store"; }
              location = /imprint.html { return 301 /imprint; }
              location = /data-privacy.html { return 301 /data-privacy; }
              location = /terms-conditions.html { return 301 /terms-conditions; }
              location = /studio-rules.html { return 301 /studio-rules; }
              location = /shop.html { return 301 /shop; }
              location = /classfit.html { return 301 /classfit; }
              location = /login.html { return 301 /login; }
              location = /account.html { return 301 /account; }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          NGINX_ROUTES

            if [ -f /etc/letsencrypt/live/classy.smarbiz.sbs/fullchain.pem ] && [ -f /etc/letsencrypt/live/classy.smarbiz.sbs/privkey.pem ]; then
              cat > /etc/nginx/sites-available/classy.smarbiz.sbs <<'NGINX_TLS'
          server {
              listen 80;
              listen [::]:80;
              server_name classy.smarbiz.sbs;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl;
              listen [::]:443 ssl;
              http2 on;
              server_name classy.smarbiz.sbs;
              ssl_certificate /etc/letsencrypt/live/classy.smarbiz.sbs/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/classy.smarbiz.sbs/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              include /etc/nginx/snippets/classy-routes.conf;
          }
          NGINX_TLS
            else
              cat > /etc/nginx/sites-available/classy.smarbiz.sbs <<'NGINX_HTTP'
          server {
              listen 80;
              listen [::]:80;
              server_name classy.smarbiz.sbs;
              include /etc/nginx/snippets/classy-routes.conf;
          }
          NGINX_HTTP
            fi
            ln -sfn /etc/nginx/sites-available/classy.smarbiz.sbs /etc/nginx/sites-enabled/classy.smarbiz.sbs
            nginx -t
            systemctl reload nginx || nginx -s reload
          }

          if command -v nginx >/dev/null 2>&1; then
            configure_nginx
          elif command -v caddy >/dev/null 2>&1 && [ -f /etc/caddy/Caddyfile ]; then
            if ! grep -q 'classy.smarbiz.sbs' /etc/caddy/Caddyfile; then
              cat >> /etc/caddy/Caddyfile <<'CADDY'

          classy.smarbiz.sbs {
              encode zstd gzip
              root * /opt/classypilates/public
              handle /api/* {
                  reverse_proxy 127.0.0.1:8787
              }
              try_files {path} /index.html
              file_server
          }
          CADDY
            fi
            caddy validate --config /etc/caddy/Caddyfile
            systemctl reload caddy
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y nginx
            configure_nginx
          else
            echo "API is running on 127.0.0.1:8787 but no supported reverse proxy was found."
            exit 1
          fi

          if command -v certbot >/dev/null 2>&1 && command -v nginx >/dev/null 2>&1; then
            certbot --nginx -d classy.smarbiz.sbs --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
          fi

          if command -v nginx >/dev/null 2>&1; then
            if [ -f /etc/letsencrypt/live/classy.smarbiz.sbs/fullchain.pem ]; then
              VERIFY_URL="https://classy.smarbiz.sbs"
              VERIFY_RESOLVE=(--resolve classy.smarbiz.sbs:443:127.0.0.1)
            else
              VERIFY_URL="http://127.0.0.1"
              VERIFY_RESOLVE=(-H "Host: classy.smarbiz.sbs")
            fi
            curl -kfsS "${VERIFY_RESOLVE[@]}" "$VERIFY_URL/login" | grep -q 'ONE LOGIN'
            curl -kfsS "${VERIFY_RESOLVE[@]}" "$VERIFY_URL/account" | grep -q 'MEIN BEREICH'
            LOGIN_HTML_CODE=$(curl -ksS -o /dev/null -w '%{http_code}' "${VERIFY_RESOLVE[@]}" "$VERIFY_URL/login.html")
            ACCOUNT_HTML_CODE=$(curl -ksS -o /dev/null -w '%{http_code}' "${VERIFY_RESOLVE[@]}" "$VERIFY_URL/account.html")
            test "$LOGIN_HTML_CODE" = "301"
            test "$ACCOUNT_HTML_CODE" = "301"
          fi

          docker compose ps
          REMOTE

      - name: Verify public endpoint
        id: public_verify
        run: |
          sleep 5
          curl -fsSIL --max-time 20 https://classy.smarbiz.sbs/ >/dev/null
          curl -fsSL --max-time 20 https://classy.smarbiz.sbs/api/health | grep -q '"ok":true'

      - name: Publish deployment heartbeat
        if: always()
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          REMOTE_STATUS="unavailable"
          API_STATUS="unavailable"
          if command -v sshpass >/dev/null 2>&1 && [ -n "$HOST" ] && [ -n "$PASS" ]; then
            export SSHPASS="$PASS"
            REMOTE_STATUS=$(sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 root@"$HOST" "cd /opt/classypilates 2>/dev/null && docker compose ps 2>&1 | head -n 20" || true)
            API_STATUS=$(sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 root@"$HOST" "curl -fsS --max-time 5 http://127.0.0.1:8787/api/health 2>&1" || true)
          fi
          cat > DEPLOYMENT_STATUS.md <<EOF
          # Classy Production Deployment Status

          - Workflow status: **${JOB_STATUS}**
          - Commit: \`${COMMIT_SHA}\`
          - Checked at: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`
          - Local API health: \`${API_STATUS//$'\n'/ }\`

          ## Remote containers
          \`\`\`
          ${REMOTE_STATUS}
          \`\`\`
          EOF
          git config user.name "classy-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add DEPLOYMENT_STATUS.md
          git commit -m "chore: update deployment status [skip ci]" || exit 0
          git push origin HEAD:main
