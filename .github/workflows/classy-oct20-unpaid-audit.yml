name: Classy October 20 Unpaid Local Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/classy-oct20-unpaid-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install SSH
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Read local booking and payment evidence only
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PASS"
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/classypilates
          echo '=== PRODUCTION LOCAL CLASS AND BOOKING STATUS (NO PROVIDER CALLS) ==='
          docker compose exec -T db sh -lc 'psql -X -qAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          SELECT 'target_class_count=' || count(*)
          FROM classes c
          WHERE c.starts_at AT TIME ZONE 'Europe/Berlin' BETWEEN '2026-10-20 18:00' AND '2026-10-20 19:00';
          SELECT concat_ws(' | ',
            'customer=' || CASE
              WHEN lower(b.customer_name) LIKE '%olga%' THEN 'Olga'
              WHEN lower(b.customer_name) LIKE '%arisa%' THEN 'Arisa'
              ELSE 'other' END,
            'class_date=' || to_char(c.starts_at AT TIME ZONE 'Europe/Berlin','YYYY-MM-DD HH24:MI'),
            'source=' || coalesce(b.source, ''),
            'booking=' || coalesce(b.status, ''),
            'payment_method=' || coalesce(b.payment_method, ''),
            'payment=' || coalesce(b.payment_status, ''),
            'hold=' || coalesce(b.mindbody_sync_status, ''),
            'visit_linked=' || (nullif(b.mindbody_visit_id,'') IS NOT NULL),
            'client_linked=' || (nullif(b.mindbody_client_id,'') IS NOT NULL),
            'order_status=' || coalesce(po.status, 'none'),
            'order_provider=' || coalesce(po.provider, 'none'),
            'sumup_paid_reference=' || (po.provider_payment_id IS NOT NULL),
            'sale=' || coalesce(po.mindbody_sale_status, 'none'),
            'sale_error_kind=' || CASE
              WHEN po.mindbody_sale_error IS NULL OR po.mindbody_sale_error = '' THEN 'none'
              WHEN lower(po.mindbody_sale_error) LIKE '%full%' THEN 'class_full'
              WHEN lower(po.mindbody_sale_error) LIKE '%token%' THEN 'token'
              WHEN lower(po.mindbody_sale_error) LIKE '%timeout%' THEN 'timeout'
              WHEN lower(po.mindbody_sale_error) LIKE '%service%' THEN 'service_mapping'
              ELSE 'other' END,
            'recovery_attempts=' || coalesce(r.attempts::text, 'none')
          )
          FROM bookings b
          JOIN classes c ON c.id=b.class_id
          LEFT JOIN LATERAL (SELECT po.* FROM payment_orders po
            WHERE po.booking_reference=b.reference ORDER BY po.id DESC LIMIT 1) po ON TRUE
          LEFT JOIN mindbody_paid_sale_recovery r ON r.order_id=po.id
          WHERE (
            (lower(b.customer_name) LIKE '%olga%' AND lower(b.customer_name) LIKE '%koehlich%')
            OR (lower(b.customer_name) LIKE '%arisa%' AND lower(b.customer_name) LIKE '%shiba%')
          )
          AND c.starts_at AT TIME ZONE 'Europe/Berlin' >= '2026-10-18'
          AND c.starts_at AT TIME ZONE 'Europe/Berlin' < '2026-10-24'
          ORDER BY c.starts_at DESC LIMIT 15;
          SELECT concat_ws(' | ',
            'pending_paid_sumup_sales=' || count(*),
            'with_visit=' || count(*) FILTER (WHERE nullif(b.mindbody_visit_id,'') IS NOT NULL)
          )
          FROM payment_orders po JOIN bookings b ON po.booking_reference=b.reference
          WHERE po.status='paid' AND po.provider='sumup'
            AND po.mindbody_sale_status IN ('', 'pending', 'failed');
          SELECT 'recovery_attempts_today=' || count(*)
          FROM mindbody_paid_sale_recovery
          WHERE last_attempt_at >= date_trunc('day', now());
          SQL
          echo '=== ROOT CAUSE PRICE AND SERVICE DETAILS (LOCAL ONLY) ==='
          docker compose exec -T db sh -lc 'psql -X -qAt -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          SELECT concat_ws(' | ',
            'customer=' || CASE WHEN lower(b.customer_name) LIKE '%olga%' THEN 'Olga' ELSE 'Arisa' END,
            'class_date=' || to_char(c.starts_at AT TIME ZONE 'Europe/Berlin','YYYY-MM-DD HH24:MI'),
            'booking_amount_cents=' || coalesce(b.amount_cents::text,'none'),
            'order_amount_cents=' || coalesce(po.amount_cents::text,'none'),
            'service_id_stored=' || (nullif(po.mindbody_service_id,'') IS NOT NULL),
            'error=' || CASE
              WHEN lower(po.mindbody_sale_error) LIKE '%mindbody_single_class_service_ambiguous:0%' THEN 'no_matching_1_class_service'
              WHEN lower(po.mindbody_sale_error) LIKE '%mindbody_single_class_service_ambiguous:%' THEN 'ambiguous_service'
              WHEN lower(po.mindbody_sale_error) LIKE '%mindbody_location_mapping_failed%' THEN 'location_mapping_failed'
              WHEN lower(po.mindbody_sale_error) LIKE '%mindbody_single_class_service_missing_id%' THEN 'missing_service_id'
              WHEN lower(po.mindbody_sale_error) LIKE '%price%' THEN 'price'
              WHEN lower(po.mindbody_sale_error) LIKE '%service%' THEN 'other_service'
              ELSE 'other' END
          )
          FROM bookings b
          JOIN classes c ON c.id=b.class_id
          JOIN payment_orders po ON po.booking_reference=b.reference
          WHERE (
            (lower(b.customer_name) LIKE '%olga%' AND lower(b.customer_name) LIKE '%koehlich%')
            OR (lower(b.customer_name) LIKE '%arisa%' AND lower(b.customer_name) LIKE '%shiba%')
          )
          AND c.starts_at AT TIME ZONE 'Europe/Berlin' >= '2026-10-18'
          AND c.starts_at AT TIME ZONE 'Europe/Berlin' < '2026-10-24'
          ORDER BY po.created_at DESC LIMIT 5;
          SELECT concat_ws(' | ',
            'amount_cents=' || po.amount_cents::text,
            'orders=' || count(*),
            'error_kind=' || CASE
              WHEN lower(po.mindbody_sale_error) LIKE '%mindbody_single_class_service_ambiguous:0%' THEN 'no_match'
              WHEN lower(po.mindbody_sale_error) LIKE '%service%' THEN 'service'
              WHEN lower(po.mindbody_sale_error) LIKE '%location%' THEN 'location'
              ELSE 'other' END
          )
          FROM payment_orders po JOIN bookings b ON b.reference=po.booking_reference
          WHERE po.status='paid' AND po.provider='sumup' AND po.mindbody_sale_status IN ('','pending','failed')
          GROUP BY po.amount_cents,
            CASE WHEN lower(po.mindbody_sale_error) LIKE '%mindbody_single_class_service_ambiguous:0%' THEN 'no_match'
                 WHEN lower(po.mindbody_sale_error) LIKE '%service%' THEN 'service'
                 WHEN lower(po.mindbody_sale_error) LIKE '%location%' THEN 'location'
                 ELSE 'other' END;
          SQL
          echo '=== END READ ONLY ==='
          REMOTE
