name: Verify Admin Reset Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-admin-reset-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH helper
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Verify reset applied without exposing credentials
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PASS"
          export SSHPASS="$PASS"
          for i in $(seq 1 45); do
            RESULT="$(sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@"$HOST" \
              "curl -fsS --max-time 5 http://127.0.0.1:8787/api/internal/admin-password-reset-status-20260915" 2>/dev/null || true)"
            if printf '%s' "$RESULT" | grep -q '"ok":true'; then
              printf '%s\n' "$RESULT"
              python3 - "$RESULT" <<'PY'
import json, sys
status = json.loads(sys.argv[1])
if status.get('admin_count') != 1 or status.get('applied') is not True:
    raise SystemExit('Administrator reset was not applied to exactly one account')
print('Verified: exactly one active Administrator was reset.')
PY
              exit 0
            fi
            sleep 2
          done
          echo 'Could not verify administrator reset endpoint.' >&2
          exit 1
