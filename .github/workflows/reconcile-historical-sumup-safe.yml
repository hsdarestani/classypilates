name: Guarded previous SumUp to Mindbody reconciliation
on:
  push:
    branches: [main]
    paths: [".github/workflows/reconcile-historical-sumup-safe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Install SSH utility
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Reconcile verified paid existing visits, stop on ambiguity
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PASS"
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=20 -o ServerAliveCountMax=90 root@"$HOST" 'cd /opt/classypilates && docker compose exec -T api python -' <<'PY'
          from collections import Counter
          from datetime import datetime, timedelta, timezone
          from time import sleep
          from sqlalchemy import select, func
          import main as core
          import mindbody_sync as mb

          # External paid sales only; never charge, book seats, change credits, or
          # infer payment from a customer's name/email.
          PRICE_IDS = {
              "oval":"100072",
              "bornheim":"100074",
              "sachsen":"100075",
              "bhf1":"100073",
              "ladies":"100073",
              "mid":"100071",
          }
          MAX_RECONCILED = 80
          MAX_UNCONFIRMED = 3
          summary = Counter()
          now = datetime.now(timezone.utc)
          print("START guarded historical reconcile; SumUp paid orders only")
          with core.SessionLocal() as db:
              order_ids = db.scalars(
                  select(core.PaymentOrder.id)
                  .join(core.Booking,
                        core.Booking.reference == core.PaymentOrder.booking_reference)
                  .where(
                      core.PaymentOrder.provider == "sumup",
                      core.PaymentOrder.status == "paid",
                      core.PaymentOrder.provider_payment_id.is_not(None),
                      core.PaymentOrder.mindbody_sale_status.in_(
                          ["", "pending", "failed", "manual_review"]),
                      core.PaymentOrder.created_at < now - timedelta(hours=1),
                      core.Booking.source == "website",
                      core.Booking.status == "reserved",
                      core.Booking.payment_status == "paid",
                      core.Booking.payment_method == "sumup",
                  ).order_by(core.PaymentOrder.id.asc()).limit(120)
              ).all()
          print("HISTORICAL_PAID_ORDERS_TO_SCREEN", len(order_ids))
          client = mb.WriteClient.from_env(timeout=20.0)
          for order_id in order_ids:
              if summary["synced"] >= MAX_RECONCILED or summary["not_confirmed"] >= MAX_UNCONFIRMED:
                  print("STOP: bounded attempt budget / unconfirmed provider outcomes")
                  break
              with core.SessionLocal() as db:
                  order = db.get(core.PaymentOrder, order_id)
                  if not order or not order.booking_reference:
                      summary["skipped"] += 1; continue
                  booking = db.scalar(select(core.Booking).where(
                      core.Booking.reference == order.booking_reference))
                  if not booking:
                      summary["skipped"] += 1; continue
                  unique_paid_orders = db.scalar(
                      select(func.count(core.PaymentOrder.id)).where(
                          core.PaymentOrder.booking_reference == order.booking_reference,
                          core.PaymentOrder.provider == "sumup",
                          core.PaymentOrder.status == "paid")
                  )
                  cls = booking.klass
                  state = str(order.mindbody_sale_status or "")
                  error = str(order.mindbody_sale_error or "")
                  if (state == "manual_review"
                      and not ("pricing" in error.lower()
                               or "No provided services" in error)):
                      summary["manual_non_pricing"] += 1; continue
                  if state == "failed" and error and not (
                      "pricing" in error.lower() or "No provided services" in error
                  ):
                      summary["failed_unknown_write"] += 1; continue
                  if not (
                      unique_paid_orders == 1
                      and order.provider_payment_id
                      and not order.mindbody_sale_id
                      and state in {"", "pending", "failed", "manual_review"}
                      and int(order.amount_cents or 0) == 2800
                      and int(booking.amount_cents or 0) == 2800
                      and booking.status == "reserved"
                      and booking.source == "website"
                      and booking.payment_status == "paid"
                      and booking.payment_method == "sumup"
                      and booking.mindbody_sync_status == "synced"
                      and booking.mindbody_client_id
                      and booking.mindbody_visit_id
                      and str(booking.mindbody_visit_id).isdigit()
                      and cls.mindbody_class_id
                      and cls.studio_id in PRICE_IDS
                  ):
                      summary["skipped"] += 1; continue
                  studio = cls.studio_id
                  provider_class = str(cls.mindbody_class_id)
                  provider_client = str(booking.mindbody_client_id)
                  provider_visit = str(booking.mindbody_visit_id)
                  class_title = cls.title
              try:
                  # Live provider state must confirm one exact unpaid visit.
                  visits = mb._active_client_visits(
                      client, class_id=provider_class, client_id=provider_client
                  )
                  if len(visits) != 1 or mb._visit_id(visits[0]) != provider_visit:
                      summary["provider_visit_ambiguous"] += 1; continue
                  if any(mb._visit_service_identity(visits[0])):
                      summary["provider_already_has_service"] += 1; continue
                  location = mb._resolve_location(client, studio, class_title)
                  locid = str(mb._value(
                      location, "Id", "ID", "LocationId", default="") or "")
                  if not locid:
                      summary["provider_location_missing"] += 1; continue
                  opts = client.get_sale_services_for_class(provider_class, locid)
                  picked = mb._pick_single_class_service(opts, amount_cents=2800)
                  picked_id = str(mb._value(
                      picked, "Id", "ID", "ProductId", default="") or "")
                  if picked_id != PRICE_IDS[studio]:
                      summary["provider_pricing_mismatch"] += 1; continue
              except mb.MindbodyError as exc:
                  summary["provider_preflight_failed"] += 1
                  print("PREFLIGHT_ERROR_ORDER", order_id, type(exc).__name__, str(exc)[:110])
                  continue
              except Exception as exc:
                  summary["provider_preflight_failed"] += 1
                  print("PREFLIGHT_EXCEPTION_ORDER", order_id, type(exc).__name__)
                  continue

              # Only after the provider preflight is clean, re-arm an old
              # pricing-blocked manual review. Existing reconcile() rechecks the
              # same visit and locks the order before its *external* sale.
              with core.SessionLocal() as db:
                  order = db.scalar(select(core.PaymentOrder).where(
                      core.PaymentOrder.id == order_id).with_for_update())
                  booking = db.scalar(select(core.Booking).where(
                      core.Booking.reference == order.booking_reference
                  ).with_for_update()) if order else None
                  if not (order and booking
                          and order.status == "paid"
                          and order.provider == "sumup"
                          and order.provider_payment_id
                          and not order.mindbody_sale_id
                          and booking.status == "reserved"
                          and booking.payment_status == "paid"
                          and booking.payment_method == "sumup"
                          and booking.mindbody_client_id == provider_client
                          and str(booking.mindbody_visit_id or "") == provider_visit
                          and str(booking.klass.mindbody_class_id or "") == provider_class
                          and (str(order.mindbody_sale_status or "") == state)
                          and str(order.mindbody_sale_error or "") == error):
                      summary["changed_during_preflight"] += 1
                      continue
                  if state == "manual_review":
                      order.mindbody_sale_status = "pending"
                      order.mindbody_sale_error = ""
                      db.commit()
              success = mb.reconcile_paid_booking_sale(order_id)
              with core.SessionLocal() as db:
                  final = db.get(core.PaymentOrder, order_id)
                  final_status = str(final.mindbody_sale_status or "") if final else "missing"
                  sale_id_present = bool(final and final.mindbody_sale_id)
              if success and final_status == "synced":
                  summary["synced"] += 1
                  summary[f"synced_{studio}"] += 1
                  print(f"RECONCILED order_id={order_id} studio={studio} sale_id_present={sale_id_present}")
              else:
                  summary["not_confirmed"] += 1
                  print(f"NOT_CONFIRMED order_id={order_id} studio={studio} final_status={final_status}")
              sleep(0.3)
          for key, value in sorted(summary.items()):
              print("BACKFILL_RESULT", key, value)
          print("BACKFILL_COMPLETE")
          PY
