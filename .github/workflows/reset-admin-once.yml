name: Reset Classy Admin Once

on:
  push:
    paths:
      - .github/workflows/reset-admin-once.yml

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Reset first administrator
        id: reset
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          TEMP_PASSWORD="Cp-$(openssl rand -hex 10)!"
          export SSHPASS="$PASS"
          ADMIN_EMAIL=$(sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" \
            "cd /opt/classypilates && RESET_PASSWORD='$TEMP_PASSWORD' docker compose exec -T -e RESET_PASSWORD api python -" <<'PY'
          import os
          from sqlalchemy import select
          from main import SessionLocal, User, Role, pwd

          with SessionLocal() as db:
              admin_role = db.scalar(select(Role).where(Role.name == "Administrator"))
              admin = db.scalar(select(User).where(User.roles.any(Role.id == admin_role.id)).order_by(User.id)) if admin_role else None
              if not admin:
                  raise SystemExit("No administrator account exists")
              admin.password_hash = pwd.hash(os.environ["RESET_PASSWORD"])
              admin.is_active = True
              db.commit()
              print(admin.email)
          PY
          )
          cat > /tmp/classy-reset-public.pem <<'KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA1booMQZrAzdJ/JN/0j9o
          aH9rfcXcGmbQbBPykrsbKLU4i1r7qrUy9xnVaDwGdPdUvjabDyxvI4jG1KWREfN/
          dFIVgZvL3lfGNuhSRFF7PMlY4ohghyvUaI2AOi9RdnrydlqsGwptvWoGmu/ebYXc
          SyVlA9ZxVdsfOxF7fRHtRkgU4jD/8dpKsnqhMu5DI6oD+aaGs2TNDj9rcZsCRbYX
          dFD+YGSZvpdvJAGseLWVTn3YIvYKv5OUhmz2lWj5cbhyjtmg3m+Ckv6/B0RbgXbG
          m2ZPHp26QdajEf4GL/kozNVui8vss/mCGEs/yHdy8WwcbDtsZ8YN2z+RmLlgQlny
          uQIDAQAB
          -----END PUBLIC KEY-----
          KEY
          printf '{"email":"%s","password":"%s"}' "$ADMIN_EMAIL" "$TEMP_PASSWORD" \
            | openssl pkeyutl -encrypt -pubin -inkey /tmp/classy-reset-public.pem -pkeyopt rsa_padding_mode:oaep \
            | base64 -w0 > ADMIN_RESET.enc

      - name: Publish encrypted result
        run: |
          git config user.name "classy-admin-reset"
          git config user.email "actions@users.noreply.github.com"
          git add ADMIN_RESET.enc
          git commit -m "chore: publish encrypted admin reset result [skip ci]"
          git push origin HEAD:main
