name: Verify Mindbody Payment Fix

on:
  push:
    branches: [diag/verify-mindbody-payment-fix]
    paths:
      - ".github/workflows/verify-mindbody-payment-fix.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Verify production state read only
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          export SSHPASS="$PASS"
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=12 root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/classypilates

          echo "=== HEALTH ==="
          curl -fsS http://127.0.0.1:8787/api/health
          echo

          echo "=== DEPLOYED CODE MARKERS ==="
          grep -q '_base_retry_pending = mindbody_sync.retry_pending' server/runtime_app.py
          grep -q '_retry_pending_before_hold_cleanup = mindbody_sync.retry_pending' server/runtime_app.py
          grep -q 'def reconcile_paid_booking_sale' server/mindbody_sync.py
          grep -q 'MINDBODY_EXTERNAL_PAYMENT_METHOD_ID' server/mindbody_sync.py
          echo "deployed_code_markers=ok"

          echo "=== RECENT MIRROR ERRORS ==="
          RECENT_RECURSION=$(docker compose logs --since=12m api 2>&1 | grep -c 'RecursionError: maximum recursion depth exceeded' || true)
          echo "recursion_errors_last_12m=$RECENT_RECURSION"

          echo "=== BOOKING / ORDER STATE ==="
          docker compose exec -T api python - <<'PY'
          import json
          from sqlalchemy import select
          import main as core
          import mindbody_sync as mb

          refs=["CP-89C1CF84","CP-3187483E"]
          classes=set()
          rows=[]
          with core.SessionLocal() as db:
              for ref in refs:
                  booking=db.scalar(select(core.Booking).where(core.Booking.reference==ref))
                  if not booking:
                      rows.append({"reference":ref,"booking":"missing"})
                      continue
                  order=db.scalar(
                      select(core.PaymentOrder)
                      .where(core.PaymentOrder.booking_reference==ref)
                      .order_by(core.PaymentOrder.created_at.desc())
                      .limit(1)
                  )
                  classes.add(str(booking.klass.mindbody_class_id or ""))
                  rows.append({
                      "reference":ref,
                      "booking_status":booking.status,
                      "payment_status":booking.payment_status,
                      "payment_method":booking.payment_method,
                      "mindbody_sync_status":booking.mindbody_sync_status,
                      "mindbody_visit_id":booking.mindbody_visit_id,
                      "mindbody_client_id":booking.mindbody_client_id,
                      "mindbody_class_id":booking.klass.mindbody_class_id,
                      "order_status":order.status if order else None,
                      "mindbody_sale_status":getattr(order,"mindbody_sale_status",None) if order else None,
                  })
          for row in rows:
              print("STATE",json.dumps(row,sort_keys=True))

          client=mb.WriteClient.from_env(timeout=15)
          target_client="100019131"
          for class_id in sorted(x for x in classes if x):
              payload=client.get_class_visits(class_id)
              visits=mb._extract_class_visits(payload)
              active=[]
              for v in visits:
                  cancelled=bool(mb._value(v,"Cancelled","IsCancelled","LateCancelled","EarlyCancelled",default=False))
                  if str(mb._value(v,"Status","status",default="") or "").strip().casefold()=="cancelled":
                      cancelled=True
                  cid=str(mb._value(v,"ClientId","ClientID",default="") or "")
                  if cid==target_client and not cancelled:
                      active.append({
                          "visit_id":mb._value(v,"Id","ID","VisitId","VisitID"),
                          "service":mb._value(v,"ServiceName","serviceName",default=""),
                          "signed_in":mb._value(v,"SignedIn","IsSignedIn",default=None),
                      })
              print("ACTIVE_VISITS",class_id,json.dumps(active,sort_keys=True))
          PY

          echo "=== CLEANUP / MIRROR LOGS ==="
          docker compose logs --since=12m api 2>&1 | grep -Ei 'released .*hold|abandoned SumUp|stale booking|Mindbody mirror cycle failed|Mindbody availability prime' | tail -n 120 || true
          REMOTE
