name: Clean remaining UI glyph shells

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-ui-glyph-shells.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: classy-ui-glyph-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove empty glyph shells and normalize icon UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'public/index.html': [
              ('<span class="experience-card-icon"></span>', ''),
              ('Explore classes <span></span>', 'Explore classes'),
              ('Book Reformer </a>', 'Book Reformer</a>'),
              ('Book Powerformer </a>', 'Book Powerformer</a>'),
              ('Book Mat Pilates </a>', 'Book Mat Pilates</a>'),
              ('Book Barre </a>', 'Book Barre</a>'),
              ('View checkout options </a>', 'View checkout options</a>'),
            ],
            'public/app.js': [
              ('<span class="studio-arrow"></span>', ''),
              ('<div class="big-check" style="background:#d8d0c1;color:#151513"></div>', ''),
              ('Continue securely to purchase </button>', 'Continue securely to purchase</button>'),
            ],
            'public/experience.js': [
              ("floating.innerHTML='<i></i><span>Book a class</span><b></b>'", "floating.innerHTML='<i></i><span>Book a class</span>'"),
            ],
            'public/account.html': [
              ('Book a new class </a>', 'Book a new class</a>'),
            ],
            'public/account.js': [
              ('Book a class </a>', 'Book a class</a>'),
              ('Buy credits </a>', 'Buy credits</a>'),
            ],
            'public/account.css': [
              ("content:'Buchen ';", "content:'Buchen';"),
            ],
            'public/entry-gate.js': [
              ("'Alle Zahlungsarten ansehen '", "'Alle Zahlungsarten ansehen'"),
              ("'View all payment methods '", "'View all payment methods'"),
            ],
            'public/client-feedback.js': [
              ("const flag=l=>l==='de'?'':'';", "const flag=()=>'';"),
              ('data-booking-lang="de"> DE</button>', 'data-booking-lang="de">DE</button>'),
              ('data-booking-lang="en"> EN</button>', 'data-booking-lang="en">EN</button>'),
            ],
            'public/staff-class-language.js': [
              ("const badge=value=>normal(value)==='en'?' EN':' DE';", "const badge=value=>normal(value)==='en'?'EN':'DE';"),
              ('<option value="de"> DE</option>', '<option value="de">DE</option>'),
              ('<option value="en"> EN</option>', '<option value="en">EN</option>'),
            ],
            'public/staff-feedback.js': [
              ("badge.textContent=pref.language==='de'?' DE':' EN';", "badge.textContent=pref.language==='de'?'DE':'EN';"),
            ],
            'public/i18n.js': [
              ("'Book Reformer ':'Reformer buchen '", "'Book Reformer':'Reformer buchen'"),
              ("'Book Powerformer ':'Powerformer buchen '", "'Book Powerformer':'Powerformer buchen'"),
              ("'Book Mat Pilates ':'Mat Pilates buchen '", "'Book Mat Pilates':'Mat Pilates buchen'"),
              ("'Book Barre ':'Barre buchen '", "'Book Barre':'Barre buchen'"),
              ("'View all payment methods ':'Alle Zahlungsarten ansehen '", "'View all payment methods':'Alle Zahlungsarten ansehen'"),
              ("'Book a new class ':'Neuen Kurs buchen '", "'Book a new class':'Neuen Kurs buchen'"),
              ("'Book a class ':'Kurs buchen '", "'Book a class':'Kurs buchen'"),
              ("'Buy credits ':'Guthaben kaufen '", "'Buy credits':'Guthaben kaufen'"),
            ],
            'public/staff.html': [
              ('<button id="logout" title="Sign out"></button>', '<button id="logout" title="Sign out" aria-label="Sign out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg></button>'),
            ],
          }

          phone_svg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.6 3.5 9 8l-2 1.5c1.2 2.7 3.3 4.8 6 6l1.5-2 4.5 2.4-.8 3c-.2.8-.9 1.3-1.7 1.3C9.4 20 3.8 14.6 3.8 7.5c0-.8.5-1.5 1.3-1.7l1.5-.4Z"/></svg>'
          plus_svg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
          instagram_svg = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>'

          booking = Path('public/booking-flow.js')
          text = booking.read_text(encoding='utf-8')
          text = text.replace("const PHONE='+4915253816033';", "const PHONE='+4951328533996';")
          old_quick = "dock.innerHTML=`<a href=\"tel:${PHONE}\" aria-label=\"Call Classy Pilates\"><span class=\"dock-icon\">☎</span><b>Call</b></a><a href=\"#schedule\" aria-label=\"Book a class\"><span class=\"dock-icon\">＋</span><b>Book</b></a><a href=\"${INSTAGRAM}\" target=\"_blank\" rel=\"noopener\" aria-label=\"Open Instagram\"><span class=\"dock-icon\">◎</span><b>Instagram</b></a>`"
          new_quick = f"dock.innerHTML=`<a href=\"tel:${{PHONE}}\" aria-label=\"Call Classy Pilates\"><span class=\"dock-icon\">{phone_svg}</span><b>Call</b></a><a href=\"#schedule\" aria-label=\"Book a class\"><span class=\"dock-icon\">{plus_svg}</span><b>Book</b></a><a href=\"${{INSTAGRAM}}\" target=\"_blank\" rel=\"noopener\" aria-label=\"Open Instagram\"><span class=\"dock-icon\">{instagram_svg}</span><b>Instagram</b></a>`"
          text = text.replace(old_quick, new_quick)
          old_actions = "wrap.innerHTML=`<a href=\"tel:${PHONE}\" data-no-studio-click aria-label=\"Call\">☎ <span>Call</span></a><button type=\"button\" data-studio-book><span>Book</span> </button><a href=\"${INSTAGRAM}\" target=\"_blank\" rel=\"noopener\" data-no-studio-click aria-label=\"Instagram\">◎ <span>Instagram</span></a>`"
          new_actions = f"wrap.innerHTML=`<a href=\"tel:${{PHONE}}\" data-no-studio-click aria-label=\"Call\">{phone_svg}<span>Call</span></a><button type=\"button\" data-studio-book>{plus_svg}<span>Book</span></button><a href=\"${{INSTAGRAM}}\" target=\"_blank\" rel=\"noopener\" data-no-studio-click aria-label=\"Instagram\">{instagram_svg}<span>Instagram</span></a>`"
          text = text.replace(old_actions, new_actions)
          booking.write_text(text, encoding='utf-8')

          changed=[]
          for filename, reps in replacements.items():
              p=Path(filename)
              if not p.exists():
                  continue
              old=p.read_text(encoding='utf-8')
              new=old
              for src,dst in reps:
                  new=new.replace(src,dst)
              if new!=old:
                  p.write_text(new,encoding='utf-8')
                  changed.append(filename)

          if booking.read_text(encoding='utf-8') != Path('public/booking-flow.js').read_text(encoding='utf-8'):
              pass
          print('Targeted cleanup completed')
          print('\n'.join(changed))
          PY

      - name: Validate UI JavaScript
        shell: bash
        run: |
          set -e
          for f in public/*.js; do node --check "$f"; done
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Nothing else to clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          git commit -m 'fix: remove empty emoji shells and stabilize UI icons'
          git push origin HEAD:main
