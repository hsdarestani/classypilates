services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-classy}
      POSTGRES_USER: ${POSTGRES_USER:-classy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - classy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classy} -d ${POSTGRES_DB:-classy}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-classy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-classy}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      UPLOAD_DIR: /data/uploads
    volumes:
      - classy_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/public:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  classy_postgres:
  classy_uploads:
  caddy_data:
  caddy_config:
