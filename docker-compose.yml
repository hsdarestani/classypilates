services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-classy}
      POSTGRES_USER: ${POSTGRES_USER:-classy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - classy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-classy} -d ${POSTGRES_DB:-classy}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-classy}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-classy}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      SEPA_PROVIDER_KEY: ${SEPA_PROVIDER_KEY:-}
    volumes:
      - classy_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  classy_postgres:
  classy_uploads:
